name: BAGO CI

on:
  pull_request:
    branches:
      - main
      - master
      - windows
      - android
      - "release/**"
  push:
    branches:
      - main
      - master
      - windows
      - android
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-react/package-lock.json

      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Install Node deps
        run: |
          npm ci
          npm ci --prefix ui-react

      - name: Python compile
        run: python -m compileall -q bago_core

      - name: Pytest
        run: python -m pytest -q

      - name: UI build
        run: |
          npm run manager:build-ui
          npm --prefix ui-react run build

      - name: Manager release jobs
        run: npm run manager:test-jobs

      - name: Dependency audit
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix ui-react --audit-level=moderate