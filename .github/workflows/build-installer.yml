name: Build BAGO Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.9.0)'
        required: true
  push:
    branches:
      - main
      - fix/installer-e2e-path
    paths:
      - 'releases/bago-installer.nsi'
      - 'releases/install-embedded-payload.ps1'
      - 'releases/build-installer.ps1'
      - 'backend/scripts/package_v4.py'
      - 'release_version.txt'
      - '.github/workflows/build-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'releases/bago-installer.nsi'
      - 'releases/install-embedded-payload.ps1'
      - 'releases/build-installer.ps1'
      - 'backend/scripts/package_v4.py'
      - 'release_version.txt'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Install and validate candidate
        run: |
          python -m pip install pytest==9.0.3 pytest-subtests==0.15.0 numpy==2.4.4 tzdata
          npm ci
          npm run build
          npm run typecheck
          npm run test:frontend
          python -m pytest backend/tests -q

      - name: Resolve current version
        id: version
        run: |
          $version = (Get-Content -LiteralPath "$PWD\release_version.txt" -Raw).Trim()
          "BAGO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Resolved BAGO version: $version"
        shell: pwsh

      - name: Install NSIS
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'nsis-tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $zip = Join-Path $tools 'nsis-3.10.zip'
          curl.exe --fail --location --retry 3 --output $zip 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10.zip/download'
          $expectedSha = 'FCDCE3229717A2A148E7CDA0AB5BDB667F39D8FB33EDE1DA8DABC336BD5AD110'
          $actualSha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualSha -ne $expectedSha) { throw "Checksum NSIS inválido" }
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          $makensis = Join-Path $tools 'nsis-3.10\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "makensis.exe no disponible" }
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile electron-viewer
        working-directory: electron-viewer
        run: |
          npm ci
          npm run dist
        shell: pwsh

      - name: Build canonical installer
        working-directory: releases
        run: |
          Write-Host "Building canonical embedded-payload installer..."
          $version = $env:BAGO_VERSION
          & .\build-installer.ps1 -SkipBuild -Version $version

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: canonical installer build failed"
            exit 1
          }

          $setupFile = "bago-$version-setup.exe"
          $sidecar = "$setupFile.sha256"
          if (-not (Test-Path $setupFile) -or -not (Test-Path $sidecar)) {
            Write-Host "ERROR: Installer file not created"
            exit 1
          }
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim().Split(' ')[0])
          $actual = (Get-FileHash -LiteralPath $setupFile -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Installer SHA256 sidecar mismatch" }
          $size = [Math]::Round((Get-Item $setupFile).Length / 1MB, 2)
          Write-Host "✓ Installer created: $setupFile ($size MB, SHA256 verified)"
        shell: pwsh

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v5
        with:
          name: bago-${{ env.BAGO_VERSION }}-setup
          path: |
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe.sha256
          retention-days: 30

      # Publication remains tag-gated in canonical-ci.yml. A manual build can
      # create an artifact, but cannot publish a release on its own authority.
