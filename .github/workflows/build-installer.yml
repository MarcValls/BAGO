name: Build BAGO MSIX Bootstrap Candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or commit to package
        required: false
  push:
    branches: [main]
    paths:
      - 'scripts/build-msix-bootstrap.ps1'
      - 'scripts/build-msix-release.ps1'
      - 'bootstrap/msix-host/**'
      - 'release_version.txt'
      - '.github/workflows/build-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-msix-bootstrap.ps1'
      - 'scripts/build-msix-release.ps1'
      - 'bootstrap/msix-host/**'
      - 'release_version.txt'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build-msix-candidate:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Build candidate payload and host
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run test:frontend
          Push-Location electron-viewer
          npm ci
          npm run dist
          Pop-Location
          $version = (Get-Content release_version.txt -Raw).Trim()
          & "$PWD/scripts/build-msix-release.ps1" -Version $version -Publisher 'CN=BAGO-CI-Test' -PackageName 'BAGO.Bootstrap' -OutputRoot "$env:RUNNER_TEMP\bago-msix"
      - name: Verify unsigned candidate evidence
        shell: pwsh
        run: |
          $receipt = Get-Content "$env:RUNNER_TEMP\bago-msix\build-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.signature -ne 'NOT_SIGNED') { throw 'Diagnostic artifact must remain explicitly unsigned.' }
          if (-not (Test-Path "$env:RUNNER_TEMP\bago-msix\BAGO-Bootstrap-$((Get-Content release_version.txt -Raw).Trim()).msix")) { throw 'MSIX artifact missing.' }
      - name: Upload unsigned diagnostic MSIX
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-ci-bago-msix-bootstrap
          path: ${{ runner.temp }}\bago-msix
          retention-days: 30
