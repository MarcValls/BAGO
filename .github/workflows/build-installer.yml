name: Build BAGO Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.9.0)'
        required: true
  push:
    branches:
      - main
      - fix/installer-e2e-path
    paths:
      - 'releases/bago-installer-local.nsi'
      - 'releases/build-installer.ps1'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: read

jobs:
  build-nsis:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve current version
        id: version
        run: |
          $version = (Get-Content -LiteralPath "$PWD\backend\release_version.txt" -Raw).Trim()
          "BAGO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Resolved BAGO version: $version"
        shell: pwsh

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Compile electron-viewer (if needed)
        working-directory: electron-viewer
        run: |
          if (-not (Test-Path "dist/win-unpacked/BAGO.exe")) {
            Write-Host "Compiling BAGO.exe..."
            npm install
            npm run dist
          } else {
            Write-Host "BAGO.exe already compiled"
          }
        shell: pwsh

      - name: Build installer
        working-directory: releases
        run: |
          Write-Host "Building installer with NSIS..."
          $version = $env:BAGO_VERSION
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $makensis /V4 "bago-installer-local.nsi"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: NSIS compilation failed"
            exit 1
          }

          # Verify
          $setupFile = "bago-$version-setup.exe"
          if (Test-Path $setupFile) {
            $size = [Math]::Round((Get-Item $setupFile).Length / 1MB, 2)
            Write-Host "✓ Installer created: $setupFile ($size MB)"
          } else {
            Write-Host "ERROR: Installer file not created"
            exit 1
          }
        shell: pwsh

      - name: Calculate SHA256
        working-directory: releases
        run: |
          $version = $env:BAGO_VERSION
          $setupFile = "bago-$version-setup.exe"
          $sha256 = (Get-FileHash -Path $setupFile -Algorithm SHA256).Hash
          Set-Content -Path "$setupFile.sha256" -Value $sha256
          Write-Host "SHA256: $sha256"
        shell: pwsh

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v5
        with:
          name: bago-${{ env.BAGO_VERSION }}-setup
          path: |
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe.sha256
          retention-days: 30

      - name: Create Release and upload assets
        if: github.event_name == 'workflow_dispatch'
        working-directory: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:BAGO_VERSION
          $tag = "${{ github.event.inputs.version }}"
          $setupFile = "bago-$version-setup.exe"
          $shaFile = "$setupFile.sha256"
          $notesFile = (New-TemporaryFile).FullName
          $notes = @(
            "BAGO $tag Release"
            ""
            "## Installation"
            'Download `$setupFile` and run it.'
            ""
            "## SHA256"
            'See `$shaFile`'
          )
          $notes | Set-Content -Path $notesFile

          gh release create $tag `
            --title "BAGO $tag" `
            --notes-file $notesFile `
            $setupFile $shaFile

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: gh release create failed"
            exit 1
          }
        shell: pwsh
