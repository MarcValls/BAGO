name: Build Release Installer Artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets: inherit

permissions:
  contents: read
  id-token: write

jobs:
  msix:
    uses: ./.github/workflows/build-release-msix-bootstrap.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
