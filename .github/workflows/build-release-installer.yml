name: Build Release Installer Artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to build (for example, v4.9.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-installer:
    name: Build tag-locked NSIS installer artifact
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag, canonical version, and candidate identity
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          git fetch --force --tags origin
          $candidateSha = (git rev-parse HEAD).Trim()
          $resolvedTagSha = (git rev-parse "$tag`^{commit}").Trim()
          $exactTag = (git describe --exact-match --tags HEAD).Trim()
          if ($candidateSha -ne $resolvedTagSha -or $exactTag -ne $tag) {
            throw "Checkout no coincide exactamente con el tag solicitado $tag."
          }
          python scripts/verify_version_consistency.py --tag $tag --is-tag true
          if ($LASTEXITCODE -ne 0) { throw "La versión canónica no coincide con el tag solicitado." }
          "BAGO_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BAGO_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CANDIDATE_SHA=$candidateSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install and validate release candidate
        run: |
          python -m pip install pytest==9.0.3 numpy==2.4.4 tzdata
          npm ci
          npm run build
          npm run typecheck
          npm run test:frontend

      - name: Build packaged Electron app
        working-directory: electron-viewer
        run: |
          npm ci
          npm run dist

      - name: Resolve pinned NSIS 3.10
        shell: pwsh
        run: |
          $makensis = & "$PWD\releases\resolve-nsis.ps1" -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nsis-tools')
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build canonical tag-locked installer
        shell: pwsh
        run: |
          & "$PWD\releases\build-installer.ps1" `
            -SkipBuild `
            -Version $env:BAGO_VERSION `
            -GitRef $env:BAGO_TAG `
            -GitSha $env:CANDIDATE_SHA `
            -NsisMakensis $env:NSIS_MAKENSIS
          if ($LASTEXITCODE -ne 0) { throw "Fallo al construir el instalador canónico." }

      - name: Verify installer identity and lifecycle
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "releases\bago-$env:BAGO_VERSION-setup.exe"
          $sidecar = "$setup.sha256"
          if (-not (Test-Path -LiteralPath $setup) -or -not (Test-Path -LiteralPath $sidecar)) {
            throw "No se generaron el instalador y su sidecar SHA-256."
          }
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim().Split()[0])
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Installer SHA-256 sidecar mismatch." }

          $installProc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { throw "El instalador terminó con código $($installProc.ExitCode)." }
          $reg = Get-ItemProperty -LiteralPath 'HKCU:\Software\BAGO' -ErrorAction Stop
          if ($reg.Version -ne $env:BAGO_VERSION) { throw "Version inesperada: $($reg.Version)" }
          if ($reg.InstallRef -ne $env:BAGO_TAG) { throw "InstallRef inesperado: $($reg.InstallRef)" }
          if ($reg.InstallSha -ne $env:CANDIDATE_SHA) { throw "InstallSha inesperado: $($reg.InstallSha)" }
          $exe = Join-Path $reg.InstallPath 'electron-viewer\BAGO.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No existe BAGO.exe instalado." }
          $env:BAGO_E2E_AUTOCLOSE_SECONDS = '8'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "BAGO.exe terminó antes de estar saludable." }
              try {
                if ((Invoke-WebRequest -Uri 'http://127.0.0.1:8080/health' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "BAGO.exe no levantó backend saludable." }
            Wait-Process -Id $proc.Id -Timeout 90 -ErrorAction SilentlyContinue
            $proc.Refresh()
            if (-not $proc.HasExited -or $proc.ExitCode -ne 0) { throw "BAGO.exe no cerró correctamente." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item Env:BAGO_E2E_AUTOCLOSE_SECONDS -ErrorAction SilentlyContinue
          }
          $uninstallExe = Join-Path $reg.InstallPath 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstallExe)) { throw "No existe uninstall.exe." }
          $uninstallProc = Start-Process -FilePath $uninstallExe -ArgumentList '/S' -PassThru -Wait
          if ($uninstallProc.ExitCode -ne 0) { throw "El desinstalador terminó con código $($uninstallProc.ExitCode)." }
          if (Test-Path -LiteralPath $reg.InstallPath) { throw "El directorio de instalación no se eliminó." }
          if (Test-Path 'HKCU:\Software\BAGO') { throw "La clave de instalación sigue presente." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: bago-setup-${{ inputs.release_tag }}
          path: |
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe
            releases/bago-${{ env.BAGO_VERSION }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
