name: Build Release Installer Artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to build
        required: true
        type: string
      signing_backend:
        description: Signing backend (azure; unsupported backends fail closed)
        required: false
        default: azure
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      signing_backend:
        required: false
        default: azure
        type: string
    secrets: inherit

permissions:
  contents: read
  id-token: write

jobs:
  msix:
    uses: ./.github/workflows/build-release-msix-bootstrap.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      signing_backend: ${{ inputs.signing_backend }}
    secrets: inherit
