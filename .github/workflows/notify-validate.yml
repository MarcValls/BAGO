name: Notify Validate Completion

on:
  workflow_run:
    workflows: ["Validate Expected"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'unknown';
            const status = conclusion === 'success' ? '✅ passed' : conclusion === 'failure' ? '❌ failed' : `⚠️ ${conclusion}`;
            const marker = '<!-- notify-validate -->';

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
              per_page: 1,
            });
            if (pulls.length === 0) {
              core.info(`No open PR found for head ${run.head_branch}; nothing to comment on.`);
              return;
            }
            const pr = pulls[0];

            const body = [
              marker,
              `## CI Validate — ${status}`,
              '',
              `- Workflow: \`${run.name}\``,
              `- Run: [#${run.run_number}](${run.html_url})`,
              `- Commit: \`${run.head_sha.slice(0, 7)}\``,
              `- Branch: \`${run.head_branch}\``,
              '',
              conclusion === 'success'
                ? 'All validation steps passed. The PR is ready to merge if other required checks are also green.'
                : 'One or more validation steps failed. Open the run link above for the full log.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const previous = existing.find(c => c.body && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
              core.info(`Updated existing notification comment on PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Posted new notification comment on PR #${pr.number}.`);
            }
