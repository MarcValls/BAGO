name: Validate Expected

on:
  pull_request:
  push:
    branches:
      - release/*

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend validate
        working-directory: backend
        run: python bago_core/cli.py validate
