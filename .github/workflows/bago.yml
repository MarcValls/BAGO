name: BAGO Code Health

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime syntax
        run: python -m compileall -q bago_core .bago/tools projects
      - name: Test dependencies
        run: python -m pip install pytest
      - name: BAGO validate
        env:
          GITHUB_ACTIONS: 'true'
          BAGO_SKIP_WIZARD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python bago_core/launcher.py validate
      - name: Music tests
        run: python -m pytest projects/music/tests -q
      - name: Image generator smoke test
        run: python projects/image_generation/generators/image_gen.py --test
