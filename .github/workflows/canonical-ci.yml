name: Canonical CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'
  HEALTH_URL: 'http://127.0.0.1:8080/health'

jobs:
  validate:
    name: Validate source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate version and tag identity
        shell: pwsh
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/') }}".ToLowerInvariant()
          python scripts/verify_version_consistency.py --tag "${{ github.ref_name }}" --is-tag $isTag

      - name: Install dependencies
        run: |
          python -m pip install pytest==9.0.3 numpy==2.4.4 tzdata
          npm ci
          npm audit --audit-level=moderate

      - name: Check generated truth projections for drift
        shell: pwsh
        run: |
          python backend/scripts/generate_api_routes_contract.py --check
          if ($LASTEXITCODE -ne 0) { throw "API routes projection drifted." }
          python backend/scripts/generate_import_migration_inventory.py --check
          if ($LASTEXITCODE -ne 0) { throw "Import migration inventory drifted." }
          python -m pytest backend/tests/test_import_consolidation.py::test_migration_inventory_is_current_and_machine_checkable -q
          if ($LASTEXITCODE -ne 0) { throw "Import migration inventory drifted." }
          python -m pytest backend/tests/test_version_drift.py -q
          if ($LASTEXITCODE -ne 0) { throw "Version projection drifted." }

      - name: Build, typecheck, and test frontend
        run: |
          npm run build
          npm run typecheck
          npm run test:frontend

      - name: Validate and test backend
        working-directory: backend
        run: |
          python bago_core/cli.py validate
          python -m pytest -q
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_clean_install.ps1
          npm ci
          npm run manager:test-jobs

      - name: Verify build did not modify tracked source
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Host $changes
            throw "El build ha modificado archivos versionados"
          }

  packaged-smoke:
    name: Packaged Electron smoke
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build candidate
        run: |
          npm ci
          npm run build --workspace frontend
          npm run dist --workspace electron-viewer

      - name: Resolve pinned NSIS 3.10
        shell: pwsh
        run: |
          $makensis = & "$PWD\releases\resolve-nsis.ps1" -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nsis-tools')
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build canonical installer path
        shell: pwsh
        run: |
          $version = (Get-Content release_version.txt -Raw).Trim()
          & "$PWD\releases\build-installer.ps1" -SkipBuild -Version $version -GitRef "${{ github.ref_name }}" -GitSha "${{ github.sha }}" -NsisMakensis $env:NSIS_MAKENSIS
          if ($LASTEXITCODE -ne 0) { throw "Fallo al construir el instalador canónico." }

      - name: Smoke packaged BAGO.exe lifecycle
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'electron-viewer\dist\win-unpacked\BAGO.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No existe BAGO.exe empaquetado." }
          $env:BAGO_E2E_AUTOCLOSE_SECONDS = '8'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) { throw "BAGO.exe terminó antes de estar saludable." }
              try {
                if ((Invoke-WebRequest -Uri '${{ env.HEALTH_URL }}' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "BAGO.exe no levantó backend saludable." }
            Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue
            $proc.Refresh()
            if (-not $proc.HasExited -or $proc.ExitCode -ne 0) { throw "BAGO.exe no cerró correctamente." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item Env:BAGO_E2E_AUTOCLOSE_SECONDS -ErrorAction SilentlyContinue
          }

  installer-e2e:
    name: Real installer E2E
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packaged-smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify immutable release identity
        shell: pwsh
        run: |
          git fetch --force --tags origin
          $tag = "${{ github.ref_name }}"
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne (git rev-parse "$tag`^{commit}").Trim()) { throw "El checkout no coincide con el tag." }
          python scripts/verify_version_consistency.py --tag $tag --is-tag true
          "BAGO_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CANDIDATE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release candidate
        run: |
          npm ci
          npm run build --workspace frontend
          npm run dist --workspace electron-viewer

      - name: Resolve pinned NSIS 3.10
        shell: pwsh
        run: |
          $makensis = & "$PWD\releases\resolve-nsis.ps1" -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'nsis-tools')
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build canonical tag-locked installer
        shell: pwsh
        run: |
          & "$PWD\releases\build-installer.ps1" -SkipBuild -Version $env:BAGO_VERSION -GitRef "${{ github.ref_name }}" -GitSha $env:CANDIDATE_SHA -NsisMakensis $env:NSIS_MAKENSIS
          if ($LASTEXITCODE -ne 0) { throw "Fallo al construir el instalador canónico." }

      - name: Run installer and verify identity
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "releases\bago-$env:BAGO_VERSION-setup.exe"
          $installProc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { throw "El instalador terminó con código $($installProc.ExitCode)." }
          $reg = Get-ItemProperty -LiteralPath 'HKCU:\Software\BAGO' -ErrorAction Stop
          if ($reg.Version -ne $env:BAGO_VERSION) { throw "Version inesperada: $($reg.Version)" }
          if ($reg.InstallRef -ne "${{ github.ref_name }}") { throw "InstallRef inesperado: $($reg.InstallRef)" }
          if ($reg.InstallSha -ne $env:CANDIDATE_SHA) { throw "InstallSha inesperado: $($reg.InstallSha)" }
          $exe = Join-Path $reg.InstallPath 'electron-viewer\BAGO.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No existe BAGO.exe instalado." }
          $env:BAGO_E2E_AUTOCLOSE_SECONDS = '8'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "BAGO.exe terminó antes de estar saludable." }
              try {
                if ((Invoke-WebRequest -Uri '${{ env.HEALTH_URL }}' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "BAGO.exe no levantó backend saludable." }
            Wait-Process -Id $proc.Id -Timeout 90 -ErrorAction SilentlyContinue
            $proc.Refresh()
            if (-not $proc.HasExited -or $proc.ExitCode -ne 0) { throw "BAGO.exe no cerró correctamente." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item Env:BAGO_E2E_AUTOCLOSE_SECONDS -ErrorAction SilentlyContinue
          }
          $uninstall = Join-Path $reg.InstallPath 'uninstall.exe'
          $uninstallProc = Start-Process -FilePath $uninstall -ArgumentList '/S' -PassThru -Wait
          if ($uninstallProc.ExitCode -ne 0 -or (Test-Path -LiteralPath $reg.InstallPath)) { throw "La desinstalación falló." }
