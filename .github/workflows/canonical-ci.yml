name: Canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install pytest==9.0.3 numpy==2.3.1
      - name: Install frontend workspaces
        run: npm ci
      - name: Build canonical frontend
        run: npm run build
      - name: Typecheck canonical frontend
        run: npm run typecheck
      - name: Test canonical frontend
        run: npm run test:frontend
      - name: Validate backend
        working-directory: backend
        run: python bago_core/cli.py validate
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
      - name: Test clean Windows install
        working-directory: backend
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_clean_install.ps1
      - name: Install and test manager
        working-directory: backend
        run: |
          npm ci
          npm run manager:test-jobs

  packaged-smoke:
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build canonical frontend
        run: npm run build
      - name: Build packaged Electron app
        working-directory: electron-viewer
        run: npm run dist
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $mk = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $mk)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $mk)) {
            throw "makensis.exe no disponible"
          }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' 'releases\bago-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "Fallo al compilar NSIS" }
      - name: Smoke NSIS setup.exe lifecycle
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'bago-4.8.2-setup.exe'
          if (-not (Test-Path $setup)) { throw "No existe bago-4.8.2-setup.exe" }

          $defaultInstall = Join-Path $env:LOCALAPPDATA 'BAGO'
          if (Test-Path $defaultInstall) { Remove-Item -LiteralPath $defaultInstall -Recurse -Force }
          Remove-Item -LiteralPath 'HKCU:\Software\BAGO' -Recurse -Force -ErrorAction SilentlyContinue

          $installProc = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { throw "El instalador terminó con código $($installProc.ExitCode)" }

          $reg = Get-ItemProperty -LiteralPath 'HKCU:\Software\BAGO' -ErrorAction Stop
          if ($reg.InstallRef -ne 'v4.8.2') { throw "InstallRef inesperado: $($reg.InstallRef)" }
          $installPath = $reg.InstallPath
          if (-not (Test-Path $installPath)) { throw "InstallPath no existe: $installPath" }

          $exe = Join-Path $installPath 'electron-viewer\dist\win-unpacked\BAGO.exe'
          if (-not (Test-Path $exe)) { throw "No existe BAGO.exe instalado en $exe" }

          $env:BAGO_E2E_AUTOCLOSE_SECONDS = '8'
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/health' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            try { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } } catch {}
            throw "BAGO.exe no levantó backend saludable en tiempo"
          }

          Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
            throw "BAGO.exe no cerró automáticamente para smoke test"
          }

          $stopped = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8080/health' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop | Out-Null
            } catch {
              $stopped = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) {
            throw "El backend siguió levantado tras cerrar BAGO.exe"
          }

          $uninstallExe = Join-Path $installPath 'uninstall.exe'
          if (-not (Test-Path $uninstallExe)) { throw "No existe desinstalador en $uninstallExe" }
          $unProc = Start-Process -FilePath $uninstallExe -ArgumentList '/S' -PassThru -Wait
          if ($unProc.ExitCode -ne 0) { throw "El desinstalador terminó con código $($unProc.ExitCode)" }

          if (Test-Path $installPath) { throw "El directorio de instalación no se eliminó: $installPath" }
          if (Test-Path 'HKCU:\Software\BAGO') { throw "La clave HKCU\\Software\\BAGO sigue presente tras desinstalar" }
