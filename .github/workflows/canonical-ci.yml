name: Canonical CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'
  HEALTH_URL: 'http://127.0.0.1:8080/health'

jobs:
  validate:
    name: Validate source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate version and tag identity
        shell: pwsh
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/') }}".ToLowerInvariant()
          python scripts/verify_version_consistency.py --tag "${{ github.ref_name }}" --is-tag $isTag

      - name: Install dependencies
        run: |
          python -m pip install pytest==9.0.3 numpy==2.4.4 prompt_toolkit==3.0.52 tzdata
          npm ci
          npm audit --audit-level=moderate

      - name: Check generated truth projections for drift
        shell: pwsh
        run: |
          python backend/scripts/generate_api_routes_contract.py --check
          if ($LASTEXITCODE -ne 0) { throw "API routes projection drifted." }
          python backend/scripts/generate_import_migration_inventory.py --check
          if ($LASTEXITCODE -ne 0) { throw "Import migration inventory drifted." }
          python -m pytest backend/tests/test_import_consolidation.py::test_migration_inventory_is_current_and_machine_checkable -q
          if ($LASTEXITCODE -ne 0) { throw "Import migration inventory drifted." }
          python -m pytest backend/tests/test_version_drift.py -q
          if ($LASTEXITCODE -ne 0) { throw "Version projection drifted." }
          python scripts/generate_readme_projection.py --check
          if ($LASTEXITCODE -ne 0) { throw "README generated truth projection drifted." }
          python scripts/verify_readme_freshness.py
          if ($LASTEXITCODE -ne 0) { throw "README truth or impact gate failed." }

      - name: Build, typecheck, and test frontend
        run: |
          npm run build
          npm run typecheck
          npm run test:frontend

      - name: Validate and test backend
        working-directory: backend
        run: |
          python bago_core/cli.py validate
          python -m pytest -q
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_clean_install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Clean-install gate failed." }
          npm ci
          npm run manager:test-jobs

      - name: Verify build did not modify tracked source
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Host $changes
            throw "El build ha modificado archivos versionados"
          }

  packaged-smoke:
    name: Packaged Electron smoke
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build candidate
        run: |
          npm ci
          npm run build --workspace frontend
          npm run dist --workspace electron-viewer

      - name: Smoke packaged BAGO.exe lifecycle
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'electron-viewer\dist\win-unpacked\BAGO.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No existe BAGO.exe empaquetado." }
          $env:BAGO_E2E_AUTOCLOSE_SECONDS = '8'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) { throw "BAGO.exe terminó antes de estar saludable." }
              try {
                if ((Invoke-WebRequest -Uri '${{ env.HEALTH_URL }}' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "BAGO.exe no levantó backend saludable." }
            Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue
            $proc.Refresh()
            if (-not $proc.HasExited -or $proc.ExitCode -ne 0) { throw "BAGO.exe no cerró correctamente." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item Env:BAGO_E2E_AUTOCLOSE_SECONDS -ErrorAction SilentlyContinue
          }

  installer-e2e:
    name: Real installer E2E
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packaged-smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert disposable runner and tag-only execution
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw "El Installer E2E solo puede ejecutarse dentro de un runner GitHub desechable." }
          if (-not $env:RUNNER_TEMP -or -not (Test-Path -LiteralPath $env:RUNNER_TEMP)) { throw "RUNNER_TEMP no identifica un runner desechable." }
          if ("${{ github.ref }}" -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Installer E2E bloqueado fuera de refs/tags/vX.Y.Z." }

      - name: Verify immutable release identity
        shell: pwsh
        run: |
          git fetch --force --tags origin
          $tag = "${{ github.ref_name }}"
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne (git rev-parse "$tag`^{commit}").Trim()) { throw "El checkout no coincide con el tag." }
          python scripts/verify_version_consistency.py --tag $tag --is-tag true
          "BAGO_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CANDIDATE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release candidate
        run: |
          npm ci
          npm run build --workspace frontend
          npm run dist --workspace electron-viewer

      - name: Build tag-locked MSIX bootstrap candidate
        shell: pwsh
        run: |
          & "$PWD\scripts\build-msix-release.ps1" -Version $env:BAGO_VERSION -Publisher 'CN=BAGO-CI-Test' -PackageName 'BAGO.Bootstrap' -OutputRoot "$env:RUNNER_TEMP\bago-msix"

      - name: Register and activate MSIX on disposable runner
        shell: pwsh
        run: |
          $msix = "$env:RUNNER_TEMP\bago-msix\BAGO-Bootstrap-$env:BAGO_VERSION.msix"
          if (-not (Test-Path $msix)) { throw 'MSIX candidate missing.' }
          # The CI candidate is unsigned by design; package activation remains
          # a release-signing workflow responsibility.
          $receipt = Get-Content "$env:RUNNER_TEMP\bago-msix\build-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.signature -ne 'NOT_SIGNED') { throw 'Unsigned CI candidate has invalid receipt state.' }
          if ($receipt.candidate_head -ne $env:CANDIDATE_SHA) { throw 'Candidate identity drifted.' }
