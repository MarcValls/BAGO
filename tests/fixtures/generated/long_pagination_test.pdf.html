<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>long_pagination_test — BAGO PDF Export</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    body { background: white; margin: 0; padding: 0; }
    .container { max-width: none; margin: 0; padding: 0; border-radius: 0; box-shadow: none; }
    .no-print { display: none !important; }
    #score { border: none; padding: 0; min-height: auto; }
    h1 { font-size: 16px; margin: 0 0 4px 0; }
    .meta { font-size: 10px; margin-bottom: 8px; }
    .stave-block { page-break-inside: avoid; break-inside: avoid; margin-bottom: 2px; }
    svg { max-width: 100%; height: auto; display: block; }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
  .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 2px; color: #222; }
  .meta { font-size: 12px; color: #666; margin-bottom: 16px; }
  #score { border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px; min-height: 160px; }
  .btn-bar { margin-top: 16px; display: flex; gap: 8px; }
  button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #00d4aa; color: white; }
  .btn-secondary { background: #eee; color: #333; }
  .error { color: #c00; font-size: 13px; padding: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>long_pagination_test</h1>
  <div class="meta">Generado por BAGO Music Pipeline — 48 notas, 12 compases</div>
  <div id="score"></div>
  <div class="btn-bar no-print">
    <button class="btn-primary" onclick="window.print()">Imprimir / Guardar PDF</button>
    <button class="btn-secondary" onclick="window.close()">Cerrar</button>
  </div>
</div>
<script src="https://unpkg.com/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<script>
  const measures = [[{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}], [{"keys": ["C/4"], "duration": "q", "type": "quarter"}, {"keys": ["E/4"], "duration": "q", "type": "quarter"}, {"keys": ["G/4"], "duration": "q", "type": "quarter"}, {"keys": ["C/5"], "duration": "q", "type": "quarter"}]];
  const div = document.getElementById("score");

  function render() {
    if (typeof Vex === "undefined") {
      div.innerHTML = "<div class=\"error\">No se pudo cargar VexFlow. Conecta a internet o descarga VexFlow localmente.</div>";
      return;
    }
    const VF = Vex.Flow;

    measures.forEach((measureNotes, idx) => {
      const block = document.createElement("div");
      block.className = "stave-block";
      div.appendChild(block);

      const renderer = new VF.Renderer(block, VF.Renderer.Backends.SVG);
      const staveWidth = Math.min(block.clientWidth || 1100, 1100);
      renderer.resize(staveWidth, 85);
      const ctx = renderer.getContext();

      const stave = new VF.Stave(10, 10, staveWidth - 20);
      if (idx === 0) {
        stave.addClef("treble").addTimeSignature("4/4");
      }
      stave.setContext(ctx).draw();

      const vfNotes = measureNotes.map(n => new VF.StaveNote({clef: "treble", keys: n.keys, duration: n.duration}));
      const voice = new VF.Voice({num_beats: 4, beat_value: 4});
      voice.addTickables(vfNotes);
      new VF.Formatter().joinVoices([voice]).format([voice], staveWidth - 30);
      voice.draw(ctx, stave);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  setTimeout(render, 1000);
</script>
</body>
</html>
