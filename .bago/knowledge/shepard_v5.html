<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BAGO · Interferencia de Armónicos — Constante y Desfasado</title>
<style>
  :root {
    --bg: #06060e;
    --panel: #0d0d1a;
    --border: #18183a;
    --txt: #b8b8d8;
    --dim: #3a3a5a;
    --v1: #7c3aed;
    --v2: #0ea5e9;
    --v3: #10b981;
    --node: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--txt);
    font-family:'SF Mono',Consolas,monospace;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── SPIRAL ZONE ── */
  #top { position:relative; flex:1 1 auto; overflow:hidden; }
  #sc  { display:block; width:100%; height:100%; }

  /* MODE TOGGLE — hero button */
  #mode-toggle {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; border:1px solid var(--border); border-radius:28px;
    overflow:hidden; backdrop-filter:blur(8px);
    background:rgba(6,6,14,.9); z-index:30;
  }
  .mt-btn {
    padding:7px 20px; font-family:inherit; font-size:11px; letter-spacing:.8px;
    cursor:pointer; border:none; background:transparent; transition:.25s;
    text-transform:uppercase;
  }
  .mt-btn.max  { color:#fbbf24; }
  .mt-btn.inv  { color:#4a4a7a; }
  .mt-btn.max.active  { background:rgba(251,191,36,.12); color:#fbbf24; }
  .mt-btn.inv.active  { background:rgba(100,100,180,.08); color:#8888bb; }

  /* INFO BAR */
  #info-bar {
    position:absolute; top:58px; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:.6px; color:var(--dim);
    white-space:nowrap; pointer-events:none;
  }

  /* CTRL */
  #ctrl {
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:7px; z-index:20;
  }
  .cbtn {
    padding:4px 12px; border-radius:14px; border:1px solid var(--border);
    background:rgba(6,6,14,.8); color:var(--dim); font-size:10px;
    font-family:inherit; cursor:pointer; transition:.2s;
  }
  .cbtn:hover { border-color:var(--txt); color:var(--txt); }
  .cbtn.on { border-color:var(--v1); color:var(--v1); }

  /* INTERFERENCE METER (top-right) */
  #meter {
    position:absolute; top:14px; right:16px;
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
    pointer-events:none;
  }
  #meter-label { font-size:8px; letter-spacing:1px; color:var(--dim); }
  #meter-bar { width:80px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  #meter-fill { height:100%; border-radius:3px; transition:width .1s, background .3s; }
  #meter-val { font-size:9px; color:var(--dim); }

  /* ── BOTTOM ZONE ── */
  #bottom { flex:0 0 auto; border-top:1px solid var(--border); background:var(--panel); }
  #wc { display:block; width:100%; height:70px; }

  /* Phase row */
  #prow { display:flex; border-top:1px solid var(--border); }
  .pcell {
    flex:1; padding:5px 10px; display:flex; align-items:center; gap:8px;
  }
  .pcell + .pcell { border-left:1px solid var(--border); }
  .plabel { font-size:9px; letter-spacing:.6px; min-width:52px; }
  .ptrack { flex:1; height:4px; background:#0d0d1a; border-radius:2px; position:relative; overflow:hidden; }
  .pfill  { height:100%; border-radius:2px; }
  .pdirec { font-size:9px; min-width:22px; text-align:right; }
  .pangle { font-size:9px; min-width:36px; text-align:right; color:var(--dim); }
</style>
</head>
<body>

<div id="top">
  <canvas id="sc"></canvas>

  <!-- Hero mode toggle -->
  <div id="mode-toggle">
    <button class="mt-btn max active" id="btn-max">↻↺ MAX ARMÓNICOS</button>
    <button class="mt-btn inv"        id="btn-inv">↻↻ INVISIBLE</button>
  </div>

  <div id="info-bar" id="info">—</div>

  <!-- Interference meter -->
  <div id="meter">
    <span id="meter-label">INTERFERENCIA</span>
    <div id="meter-bar"><div id="meter-fill"></div></div>
    <span id="meter-val">—</span>
  </div>

  <!-- Controls -->
  <div id="ctrl">
    <button class="cbtn" id="btn-audio">♪ TONO</button>
    <button class="cbtn" id="btn-node">● NODOS</button>
    <button class="cbtn" id="btn-field">⬡ CAMPO</button>
    <button class="cbtn" id="btn-solo1" style="color:var(--v1)">① SOLO</button>
    <button class="cbtn" id="btn-solo2" style="color:var(--v2)">② SOLO</button>
    <button class="cbtn" id="btn-solo3" style="color:var(--v3)">③ SOLO</button>
  </div>
</div>

<div id="bottom">
  <canvas id="wc"></canvas>
  <div id="prow">
    <div class="pcell">
      <span class="plabel" style="color:var(--v1)">① VOICE 1</span>
      <div class="ptrack"><div class="pfill" id="pf1" style="background:var(--v1)"></div></div>
      <span class="pdirec" id="pd1">↻</span>
      <span class="pangle" id="pa1">0°</span>
    </div>
    <div class="pcell">
      <span class="plabel" style="color:var(--v2)">② VOICE 2</span>
      <div class="ptrack"><div class="pfill" id="pf2" style="background:var(--v2)"></div></div>
      <span class="pdirec" id="pd2">↻</span>
      <span class="pangle" id="pa2">120°</span>
    </div>
    <div class="pcell">
      <span class="plabel" style="color:var(--v3)">③ VOICE 3</span>
      <div class="ptrack"><div class="pfill" id="pf3" style="background:var(--v3)"></div></div>
      <span class="pdirec" id="pd3">↺</span>
      <span class="pangle" id="pa3">240°</span>
    </div>
    <div class="pcell" style="max-width:180px">
      <span class="plabel" style="color:var(--node)">∑ SUMA</span>
      <div class="ptrack"><div class="pfill" id="pfS" style="background:var(--node)"></div></div>
      <span class="pangle" id="paS">0.00</span>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let mode = 'MAX';       // 'MAX' | 'INV'
let showNodes = true;
let showField = false;
let audioOn = false;
let soloVoice = -1;
let startTime = performance.now();

// Voice physics — constant angular velocity
const T = 5000;           // period ms
const OMEGA = (2 * Math.PI) / T;   // rad/ms
const PHI   = [0, 2*Math.PI/3, 4*Math.PI/3]; // static phase offsets
const COLORS = ['#7c3aed', '#0ea5e9', '#10b981'];
const TURNS  = 3.5;       // spiral turns
const INSTANCES = 6;      // infinite copies per voice

// direction[2] = -1 in MAX mode, +1 in INV mode
function direction(vi) {
  if (vi < 2) return 1;
  return mode === 'MAX' ? -1 : 1;
}

function voiceAngle(vi, t) {
  return direction(vi) * OMEGA * t + PHI[vi];
}

// Interference at angle θ and radius r at time t
// Model: each voice contributes a unit phasor at its angle + radial winding
function interfere(t, radFrac) {
  const winding = radFrac * TURNS * 2 * Math.PI;
  let rx = 0, ry = 0;
  for (let vi = 0; vi < 3; vi++) {
    const soloOk = soloVoice === -1 || soloVoice === vi;
    if (!soloOk) continue;
    const a = voiceAngle(vi, t) + winding;
    rx += Math.cos(a);
    ry += Math.sin(a);
  }
  return Math.sqrt(rx*rx + ry*ry); // 0..3
}

// ─────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────
const sc = document.getElementById('sc');
const sCtx = sc.getContext('2d');
const wc = document.getElementById('wc');
const wCtx = wc.getContext('2d');
let W, H, WW, WH, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = sc.offsetWidth; H = sc.offsetHeight;
  sc.width = W * dpr; sc.height = H * dpr;
  sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  WW = wc.offsetWidth; WH = wc.offsetHeight;
  wc.width = WW * dpr; wc.height = WH * dpr;
  wCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────
// INTERFERENCE FIELD (polar heat-map)
// Drawn once per frame into offscreen canvas
// ─────────────────────────────────────────────
let fieldCanvas = null;
let fieldCtx = null;
let fieldW = 0, fieldH = 0;

function buildFieldCanvas(cx, cy, maxR, t) {
  const sz = Math.ceil(maxR * 2);
  if (!fieldCanvas || fieldW !== sz) {
    fieldCanvas = document.createElement('canvas');
    fieldCanvas.width = sz; fieldCanvas.height = sz;
    fieldCtx = fieldCanvas.getContext('2d');
    fieldW = fieldH = sz;
  }
  const idata = fieldCtx.createImageData(sz, sz);
  const d = idata.data;
  for (let py = 0; py < sz; py++) {
    for (let px = 0; px < sz; px++) {
      const dx = px - sz/2, dy = py - sz/2;
      const r = Math.sqrt(dx*dx + dy*dy);
      if (r > maxR || r < 4) continue;
      const radFrac = r / maxR;
      const iv = interfere(t, radFrac);    // 0..3
      const norm = iv / 3;
      const idx = (py * sz + px) * 4;

      if (mode === 'MAX') {
        // Hot: yellow-orange nodes
        d[idx]   = Math.floor(norm * 200);
        d[idx+1] = Math.floor(norm * 120);
        d[idx+2] = 0;
        d[idx+3] = Math.floor(norm * 55);
      } else {
        // Cool: near-invisible blue
        d[idx]   = 0;
        d[idx+1] = Math.floor(norm * 30);
        d[idx+2] = Math.floor(norm * 80);
        d[idx+3] = Math.floor(norm * 18);
      }
    }
  }
  fieldCtx.putImageData(idata, 0, 0);
}

// ─────────────────────────────────────────────
// SPIRAL DRAW (constant velocity)
// ─────────────────────────────────────────────
function drawSpiral(vi, t, cx, cy, maxR) {
  const soloOk = soloVoice === -1 || soloVoice === vi;
  const baseAlpha = soloOk ? 1.0 : 0.07;
  const color = COLORS[vi];
  const dir = direction(vi);
  const baseAngle = voiceAngle(vi, t);

  for (let inst = 0; inst < INSTANCES; inst++) {
    // Phase spread: each instance offset by 1/INSTANCES of a full cycle
    const phaseOff = (inst / INSTANCES);
    const instT = t - phaseOff * T;    // effective time for this instance
    const instBaseAngle = direction(vi) * OMEGA * instT + PHI[vi];

    // Bell-curve envelope: instances closer to phase=0.5 are brightest
    const bellX = (phaseOff + (t % T) / T) % 1;
    const bell = Math.exp(-4 * Math.pow(bellX - 0.5, 2));
    const alpha = bell * baseAlpha * 0.85;
    if (alpha < 0.01) continue;

    const steps = 320;
    sCtx.beginPath();
    let first = true;
    for (let s = 0; s <= steps; s++) {
      const frac = s / steps;
      const angle = instBaseAngle + dir * frac * TURNS * 2 * Math.PI;
      const r = frac * maxR;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (first) { sCtx.moveTo(x, y); first = false; }
      else sCtx.lineTo(x, y);
    }
    sCtx.strokeStyle = rgba(color, alpha);
    sCtx.lineWidth = 1 + bell * 1.2;
    sCtx.shadowColor = color;
    sCtx.shadowBlur = soloOk ? 4 * bell : 0;
    sCtx.stroke();
    sCtx.shadowBlur = 0;
  }
}

// ─────────────────────────────────────────────
// NODE DETECTION & DRAW
// Constructive interference nodes: where interfere() > 2.2
// and d(interfere)/dr changes sign → local max
// ─────────────────────────────────────────────
function drawNodes(t, cx, cy, maxR) {
  const steps = 60;
  let prev = 0;

  for (let i = 1; i <= steps; i++) {
    const frac = i / steps;
    const iv = interfere(t, frac);
    // Find constructive node: high value and peak (prev was lower, next will be lower)
    if (iv > 2.1 && iv > prev) {
      const r = frac * maxR;
      // Sample a ring at this radius to find the angular position of max
      let bestAngle = 0, bestVal = 0;
      for (let a = 0; a < 360; a += 3) {
        const θ = a * Math.PI / 180;
        const winding = frac * TURNS * 2 * Math.PI;
        let rx = 0, ry = 0;
        for (let vi = 0; vi < 3; vi++) {
          const baseA = voiceAngle(vi, t) + winding;
          const diff = Math.abs(((θ - baseA) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI));
          rx += Math.cos(baseA);
          ry += Math.sin(baseA);
        }
        const val = Math.sqrt(rx*rx + ry*ry);
        if (val > bestVal) { bestVal = val; bestAngle = θ; }
      }

      const nx = cx + Math.cos(bestAngle) * r;
      const ny = cy + Math.sin(bestAngle) * r;
      const pulse = 0.5 + 0.5 * Math.sin(t / 200 + frac * 8);
      const nodeAlpha = (iv / 3) * pulse;

      sCtx.beginPath();
      sCtx.arc(nx, ny, 3 + pulse * 3, 0, Math.PI * 2);
      sCtx.fillStyle = rgba('#fbbf24', nodeAlpha * 0.9);
      sCtx.shadowColor = '#fbbf24';
      sCtx.shadowBlur = 10 * nodeAlpha;
      sCtx.fill();
      sCtx.shadowBlur = 0;

      // Entry/exit label on outermost node
      if (frac > 0.85) {
        sCtx.fillStyle = rgba('#fbbf24', nodeAlpha * 0.5);
        sCtx.font = '8px SF Mono, monospace';
        sCtx.fillText('⟳', nx + 6, ny + 3);
      }
    }
    prev = iv;
  }
}

// ─────────────────────────────────────────────
// WAVEFORM BOTTOM
// ─────────────────────────────────────────────
function drawWaveform(t) {
  wCtx.clearRect(0, 0, WW, WH);
  wCtx.fillStyle = '#0a0a10';
  wCtx.fillRect(0, 0, WW, WH);

  const mid = WH / 2;
  const N = WW;

  // Draw interference sum
  wCtx.beginPath();
  for (let x = 0; x < N; x++) {
    const frac = x / N;
    const iv = interfere(t, frac);
    const norm = (iv / 3) * 2 - 1; // -1..1
    const y = mid - norm * (WH * 0.38);
    if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
  }
  wCtx.strokeStyle = rgba('#fbbf24', 0.5);
  wCtx.lineWidth = 1.5;
  wCtx.stroke();

  // Draw each voice
  COLORS.forEach((color, vi) => {
    const soloOk = soloVoice === -1 || soloVoice === vi;
    const a = soloOk ? 0.55 : 0.08;
    wCtx.beginPath();
    for (let x = 0; x < N; x++) {
      const frac = x / N;
      const angle = voiceAngle(vi, t) + frac * TURNS * 2 * Math.PI;
      const y = mid + Math.cos(angle) * (WH * 0.32);
      if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    }
    wCtx.strokeStyle = rgba(color, a);
    wCtx.lineWidth = 1;
    wCtx.stroke();
  });
}

// ─────────────────────────────────────────────
// AUDIO ENGINE
// ─────────────────────────────────────────────
let audioCtx = null;
const voiceAudio = [null, null, null];
const OCTAVES = 5;
const BASE_HZ = [130, 195, 155]; // V1=C3, V2=G3, V3=Eb3

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  COLORS.forEach((_, vi) => { voiceAudio[vi] = buildVA(vi); });
}

function buildVA(vi) {
  const master = audioCtx.createGain();
  master.gain.value = 0.07;
  master.connect(audioCtx.destination);
  const oscs = [], gains = [];
  for (let oct = 0; oct < OCTAVES; oct++) {
    const f = BASE_HZ[vi] * Math.pow(2, oct);
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = bell(oct / (OCTAVES-1));
    o.connect(g).connect(master);
    o.start();
    oscs.push(o); gains.push(g);
  }
  return { master, oscs, gains };
}

function bell(x) { return Math.exp(-6 * Math.pow(x - 0.5, 2)); }

function updateAudio(t) {
  if (!audioCtx || !audioOn) return;
  const shepPhase = (t / 18000) % 1;

  COLORS.forEach((_, vi) => {
    const va = voiceAudio[vi];
    if (!va) return;
    const soloOk = soloVoice === -1 || soloVoice === vi;
    va.master.gain.value = soloOk ? 0.07 : 0.004;

    // In MAX mode V3 descends while others ascend
    const dir = (mode === 'MAX' && vi === 2) ? -1 : 1;
    const mult = Math.pow(2, dir * shepPhase);

    for (let oct = 0; oct < OCTAVES; oct++) {
      const f = BASE_HZ[vi] * Math.pow(2, oct) * mult;
      if (f > 20 && f < 18000) {
        va.oscs[oct].frequency.setTargetAtTime(f, audioCtx.currentTime, 0.08);
      }
      // Shifting bell envelope for Shepard illusion
      const bx = ((oct / (OCTAVES-1)) - shepPhase + 1) % 1;
      va.gains[oct].gain.setTargetAtTime(bell(bx), audioCtx.currentTime, 0.12);
    }
  });
}

// ─────────────────────────────────────────────
// UI UPDATES
// ─────────────────────────────────────────────
function updateUI(t) {
  const dirs = [1, 1, direction(2)];
  const phaseNames = COLORS.map((_, vi) => {
    const angle = ((voiceAngle(vi, t) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    return Math.round(angle * 180 / Math.PI) + '°';
  });

  ['pf1','pf2','pf3'].forEach((id, vi) => {
    const frac = (((voiceAngle(vi, t) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI)) / (2*Math.PI);
    document.getElementById(id).style.width = (frac * 100).toFixed(1) + '%';
  });
  ['pa1','pa2','pa3'].forEach((id, vi) => {
    document.getElementById(id).textContent = phaseNames[vi];
  });
  ['pd1','pd2','pd3'].forEach((id, vi) => {
    document.getElementById(id).textContent = dirs[vi] > 0 ? '↻' : '↺';
    document.getElementById(id).style.color = dirs[vi] > 0 ? '#4a4a7a' : '#fbbf24';
  });

  // Interference meter (sample at r = maxR/2)
  const iv = interfere(t, 0.5);
  const ivNorm = iv / 3;
  document.getElementById('meter-fill').style.width = (ivNorm * 100).toFixed(0) + '%';
  document.getElementById('meter-fill').style.background =
    mode === 'MAX' ? `hsl(${40 + ivNorm*20},90%,${45+ivNorm*20}%)` : '#1e2e5a';
  document.getElementById('meter-val').textContent = iv.toFixed(2);
  document.getElementById('pfS').style.width = (ivNorm * 100).toFixed(0) + '%';
  document.getElementById('paS').textContent = iv.toFixed(2);

  // Info bar
  const infoEl = document.getElementById('info-bar');
  if (mode === 'MAX') {
    infoEl.textContent = '↻↺ V3 INVERSA · nodos de interferencia constructiva activos · punto de entrada/salida detectado';
    infoEl.style.color = '#6b5a20';
  } else {
    infoEl.textContent = '↻↻ TODAS CO-ROTANDO · cancelación mutua · funcionamiento casi invisible';
    infoEl.style.color = '#2a2a5a';
  }
}

// ─────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────
function frame(now) {
  const t = now - startTime;

  sCtx.clearRect(0, 0, W, H);
  sCtx.fillStyle = '#06060e';
  sCtx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(W, H) * 0.45;

  // Interference field heatmap
  if (showField) {
    buildFieldCanvas(cx, cy, maxR, t);
    sCtx.drawImage(fieldCanvas, cx - maxR, cy - maxR, maxR*2, maxR*2);
  }

  // Spirals
  for (let vi = 0; vi < 3; vi++) drawSpiral(vi, t, cx, cy, maxR);

  // Nodes
  if (showNodes && mode === 'MAX') drawNodes(t, cx, cy, maxR);

  // Center dot
  sCtx.beginPath();
  sCtx.arc(cx, cy, 3, 0, Math.PI*2);
  sCtx.fillStyle = '#ffffff22';
  sCtx.fill();

  // Direction labels per voice (outer ring)
  COLORS.forEach((color, vi) => {
    const angle = voiceAngle(vi, t);
    const labelR = maxR * 0.9;
    const lx = cx + Math.cos(angle) * labelR;
    const ly = cy + Math.sin(angle) * labelR;
    const soloOk = soloVoice === -1 || soloVoice === vi;
    sCtx.fillStyle = rgba(color, soloOk ? 0.6 : 0.1);
    sCtx.font = '9px SF Mono, monospace';
    sCtx.textAlign = 'center';
    sCtx.textBaseline = 'middle';
    sCtx.fillText(['①','②','③'][vi], lx, ly);
  });
  sCtx.textAlign = 'left';
  sCtx.textBaseline = 'alphabetic';

  drawWaveform(t);
  updateAudio(t);
  updateUI(t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────
document.getElementById('btn-max').addEventListener('click', () => {
  mode = 'MAX';
  document.getElementById('btn-max').classList.add('active');
  document.getElementById('btn-inv').classList.remove('active');
});
document.getElementById('btn-inv').addEventListener('click', () => {
  mode = 'INV';
  document.getElementById('btn-inv').classList.add('active');
  document.getElementById('btn-max').classList.remove('active');
});

document.getElementById('btn-audio').addEventListener('click', () => {
  audioOn = !audioOn;
  document.getElementById('btn-audio').classList.toggle('on', audioOn);
  if (audioOn) initAudio();
  else if (audioCtx) voiceAudio.forEach(va => { if(va) va.master.gain.value = 0; });
});
document.getElementById('btn-node').addEventListener('click', () => {
  showNodes = !showNodes;
  document.getElementById('btn-node').classList.toggle('on', showNodes);
});
document.getElementById('btn-field').addEventListener('click', () => {
  showField = !showField;
  document.getElementById('btn-field').classList.toggle('on', showField);
});
[1,2,3].forEach(i => {
  document.getElementById(`btn-solo${i}`).addEventListener('click', () => {
    soloVoice = (soloVoice === i-1) ? -1 : i-1;
    [1,2,3].forEach(j => document.getElementById(`btn-solo${j}`).classList.toggle('on', soloVoice===j-1));
  });
});

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}
