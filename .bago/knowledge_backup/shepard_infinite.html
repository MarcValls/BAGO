<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Shepard Infinito — 3 Voces · BAGO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background: #05050a;
  width: 100%; height: 100vh;
  overflow: hidden;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}

#canvas { display: block; cursor: crosshair; }

/* ── HUD ── */
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  pointer-events: none;
}
#hud .title {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: #2a2a3e;
}
#hud .voices-legend {
  display: flex; gap: 16px;
}
#hud .vl {
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  color: #222;
  display: flex; align-items: center; gap: 5px;
  transition: color 0.4s;
}
#hud .vl .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c);
}
#hud .vl.active { color: var(--c); }

/* ── CONTROLS ── */
#controls {
  position: fixed;
  bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
  pointer-events: all;
}
.btn {
  background: rgba(10,10,20,0.9);
  border: 1px solid #1e1e3a;
  color: #444;
  font-family: inherit;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}
.btn:hover { border-color: #555; color: #888; }
.btn.active { border-color: var(--c, #c084fc); color: var(--c, #c084fc);
  box-shadow: 0 0 12px var(--c, #c084fc)44; }

/* ── PHASE LABEL (center overlay) ── */
#phase-label {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: #c084fc;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
  text-align: center;
}
#phase-label.show { opacity: 0.5; }

/* ── SPEED ── */
#speed-wrap {
  display: flex; align-items: center; gap: 8px;
}
#speed-wrap label { font-size: 0.55rem; color: #333; letter-spacing: 0.1em; }
#speed { width: 80px; accent-color: #c084fc; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <span class="title">◈ SHEPARD INFINITO · BAGO 2026-05-13</span>
  <div class="voices-legend">
    <div class="vl active" id="vl1" style="--c:#60a5fa"><span class="dot"></span>BATCH-1</div>
    <div class="vl active" id="vl2" style="--c:#a78bfa"><span class="dot"></span>BATCH-2</div>
    <div class="vl active" id="vl3" style="--c:#34d399"><span class="dot"></span>BATCH-3</div>
  </div>
</div>

<div id="phase-label"></div>

<div id="controls">
  <div id="speed-wrap">
    <label>VELOCIDAD</label>
    <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1">
  </div>

  <button class="btn" id="btn-overlay" style="--c:#c084fc">⊕ SUPERPONER</button>
  <button class="btn" id="btn-solo1"   style="--c:#60a5fa">① SOLO</button>
  <button class="btn" id="btn-solo2"   style="--c:#a78bfa">② SOLO</button>
  <button class="btn" id="btn-solo3"   style="--c:#34d399">③ SOLO</button>
  <button class="btn" id="btn-audio"   style="--c:#c084fc">♪ TONO</button>
  <button class="btn" id="btn-blend">⊞ BLEND</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════
const VOICES = [
  { id:0, label:'BATCH-1', color:'#60a5fa', r:0.0/3 },
  { id:1, label:'BATCH-2', color:'#a78bfa', r:1.0/3 },
  { id:2, label:'BATCH-3', color:'#34d399', r:2.0/3 },
];

const PHASE_COLORS = ['#f87171','#fb923c','#facc15','#4ade80','#c084fc'];
const PHASE_NAMES  = ['SCAN','ALERT','REMEDIATE','VERIFY','EVOLVE'];

// Layout
const SEP_POSITIONS = []; // filled on resize
let OVERLAY_POS = { x: 0, y: 0 };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  OVERLAY_POS = { x: W/2, y: H/2 };
  SEP_POSITIONS.length = 0;
  SEP_POSITIONS.push(
    { x: W * 0.22, y: H/2 },
    { x: W * 0.5,  y: H/2 },
    { x: W * 0.78, y: H/2 },
  );
  // init lerp targets
  VOICES.forEach((v,i) => {
    if (!v.pos) v.pos = { ...SEP_POSITIONS[i] };
    v.target = { ...SEP_POSITIONS[i] };
  });
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let overlaid   = false;
let blendMode  = false;
let soloVoice  = -1;   // -1 = all
let speedMul   = 1.0;
let lerpAlpha  = 0.06; // smoothness of position transition

// Spiral params
const TURNS     = 4.0;
const INSTANCES = 5;   // overlapping copies for infinite effect

// Per-voice mutable state
VOICES.forEach((v, i) => {
  v.pos    = { ...SEP_POSITIONS[i] };
  v.target = { ...SEP_POSITIONS[i] };
  v.alpha  = 1.0;  // visibility
});

// ═══════════════════════════════════════════════════════════════════════
// INFINITE SPIRAL DRAW
// ═══════════════════════════════════════════════════════════════════════
function getMaxR() {
  return Math.min(W, H) * (overlaid ? 0.42 : 0.18);
}

function drawInfiniteSpiral(v, t, voicePhase) {
  const { pos, color, alpha } = v;
  const maxR = getMaxR();
  const minR = 6;

  ctx.save();

  if (blendMode) {
    ctx.globalCompositeOperation = 'screen';
  }

  // Draw INSTANCES copies, each offset in radius phase
  for (let inst = 0; inst < INSTANCES; inst++) {
    // Each instance at a different point in 0→1 radius cycle
    const instPhase = ((t / 8000 + inst / INSTANCES) % 1);

    // Bell-curve opacity: loud in middle, silent at edges
    const bell = Math.exp(-4 * Math.pow(instPhase - 0.5, 2));
    const instAlpha = bell * alpha * 0.9;

    if (instAlpha < 0.01) continue;

    const steps = 500;
    ctx.beginPath();
    let started = false;

    for (let s = 0; s <= steps; s++) {
      const f = s / steps;
      const totalAngle = f * TURNS * Math.PI * 2 - Math.PI / 2;

      // Radius: starts from minR, expands to maxR — but instance phase shifts starting radius
      const r = minR + (maxR - minR) * ((f + instPhase) % 1);
      const x = pos.x + r * Math.cos(totalAngle + voicePhase * Math.PI * 2 + t * 0.0003);
      const y = pos.y + r * Math.sin(totalAngle + voicePhase * Math.PI * 2 + t * 0.0003);

      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }

    ctx.strokeStyle = color;
    ctx.lineWidth   = 2.0;
    ctx.globalAlpha = instAlpha;
    ctx.stroke();
  }

  // Phase dots — 5 markers at equal spacing, rotate with spiral
  const phaseIdx = Math.floor(((t / 8000) % 1) * 5);
  for (let p = 0; p < 5; p++) {
    const pf = (p + 0.5) / 5;
    const inst0Phase = (t / 8000) % 1;
    const r = minR + (maxR - minR) * ((pf + inst0Phase) % 1);
    const bell = Math.exp(-4 * Math.pow(((pf + inst0Phase) % 1) - 0.5, 2));
    if (bell < 0.1) continue;

    const angle = pf * TURNS * Math.PI * 2 - Math.PI / 2;
    const rotAngle = angle + voicePhase * Math.PI * 2 + t * 0.0003;
    const px = pos.x + r * Math.cos(rotAngle);
    const py = pos.y + r * Math.sin(rotAngle);

    ctx.globalAlpha = bell * alpha * 0.9;
    ctx.beginPath();
    ctx.arc(px, py, p === phaseIdx ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = PHASE_COLORS[p];
    ctx.shadowBlur = p === phaseIdx ? 14 : 6;
    ctx.shadowColor = PHASE_COLORS[p];
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Center dot
  ctx.globalAlpha = alpha * 0.6;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.shadowBlur = 12;
  ctx.shadowColor = color;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Label (separated mode only)
  if (!overlaid) {
    ctx.globalAlpha = alpha * 0.35;
    ctx.font = '10px monospace';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(v.label, pos.x, pos.y + maxR + 20);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════
let startTime = null;

function frame(ts) {
  if (!startTime) startTime = ts;
  const t = (ts - startTime) * speedMul;

  // Clear
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(5,5,10,0.18)';
  ctx.fillRect(0, 0, W, H);

  // Lerp positions
  VOICES.forEach(v => {
    v.pos.x += (v.target.x - v.pos.x) * lerpAlpha;
    v.pos.y += (v.target.y - v.pos.y) * lerpAlpha;
  });

  // Draw voices
  VOICES.forEach((v, i) => {
    const visible = (soloVoice === -1 || soloVoice === i);
    v.alpha += (( visible ? 1 : 0) - v.alpha) * 0.08;
    if (v.alpha < 0.01) return;
    drawInfiniteSpiral(v, t, v.r);
  });

  // Phase label in overlay mode
  if (overlaid) {
    const phaseIdx = Math.floor(((t / 8000) % 1) * 5);
    const pl = document.getElementById('phase-label');
    pl.textContent = PHASE_NAMES[phaseIdx];
    pl.style.color = PHASE_COLORS[phaseIdx];
    pl.classList.add('show');
  } else {
    document.getElementById('phase-label').classList.remove('show');
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// ═══════════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════════
function setTargets() {
  VOICES.forEach((v, i) => {
    v.target = overlaid
      ? { ...OVERLAY_POS }
      : { ...SEP_POSITIONS[i] };
  });
}

document.getElementById('btn-overlay').addEventListener('click', function() {
  overlaid = !overlaid;
  this.classList.toggle('active', overlaid);
  this.textContent = overlaid ? '⊗ SEPARAR' : '⊕ SUPERPONER';
  soloVoice = -1;
  ['btn-solo1','btn-solo2','btn-solo3'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  setTargets();
});

[1,2,3].forEach(n => {
  document.getElementById(`btn-solo${n}`).addEventListener('click', function() {
    const idx = n - 1;
    if (soloVoice === idx) {
      soloVoice = -1;
      this.classList.remove('active');
    } else {
      soloVoice = idx;
      ['btn-solo1','btn-solo2','btn-solo3'].forEach(id =>
        document.getElementById(id).classList.remove('active'));
      this.classList.add('active');
    }
  });
});

document.getElementById('btn-blend').addEventListener('click', function() {
  blendMode = !blendMode;
  this.classList.toggle('active', blendMode);
  this.textContent = blendMode ? '⊞ NORMAL' : '⊞ BLEND';
});

document.getElementById('speed').addEventListener('input', function() {
  speedMul = parseFloat(this.value);
});

// ═══════════════════════════════════════════════════════════════════════
// AUDIO — SHEPARD TONE
// ═══════════════════════════════════════════════════════════════════════
let audioCtx = null;
let audioNodes = [];
let audioOn = false;

function startShepard() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioNodes = [];

  const masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  const baseFreqs = [
    82.4,                              // BATCH-1 offset 0
    82.4 * Math.pow(2, 1/3),           // BATCH-2 offset 1/3 oct
    82.4 * Math.pow(2, 2/3),           // BATCH-3 offset 2/3 oct
  ];

  VOICES.forEach((v, vi) => {
    const voiceGain = audioCtx.createGain();
    voiceGain.gain.setValueAtTime(0.33, audioCtx.currentTime);
    voiceGain.connect(masterGain);

    const octaves = 6;
    for (let oct = 0; oct < octaves; oct++) {
      const freq = baseFreqs[vi] * Math.pow(2, oct);
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      const envGain = audioCtx.createGain();
      const bell = Math.exp(-0.5 * Math.pow((oct - octaves/2.0) / (octaves/3.5), 2));
      envGain.gain.setValueAtTime(bell, audioCtx.currentTime);

      osc.connect(envGain);
      envGain.connect(voiceGain);
      osc.start();

      audioNodes.push({ osc, envGain, voiceGain, oct, octaves, baseFreq: baseFreqs[vi] });
    }
  });

  const GLIDE_S  = 15; // seconds per octave
  let glideBase  = audioCtx.currentTime;

  function glide() {
    if (!audioOn) return;
    const dt    = audioCtx.currentTime - glideBase;
    const ratio = Math.pow(2, dt / GLIDE_S);

    // Dynamic volume based on solo
    audioNodes.forEach((n, ni) => {
      const voiceIdx = Math.floor(ni / (audioNodes.length / 3));
      const vol = (soloVoice === -1 || soloVoice === voiceIdx) ? 0.33 : 0.04;
      n.voiceGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.2);

      const newFreq = n.baseFreq * Math.pow(2, n.oct) * ratio;
      if (newFreq > 4000) {
        n.baseFreq /= 2;
        glideBase = audioCtx.currentTime;
      } else {
        n.osc.frequency.setValueAtTime(newFreq, audioCtx.currentTime);
      }
    });
    setTimeout(glide, 60);
  }
  glide();
}

function stopShepard() {
  audioNodes.forEach(n => { try { n.osc.stop(); } catch(e){} });
  audioNodes = [];
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
}

document.getElementById('btn-audio').addEventListener('click', function() {
  audioOn = !audioOn;
  this.classList.toggle('active', audioOn);
  this.textContent = audioOn ? '■ MUTE' : '♪ TONO';
  audioOn ? startShepard() : stopShepard();
});

// Click on canvas → overlay toggle shortcut
canvas.addEventListener('dblclick', () => {
  document.getElementById('btn-overlay').click();
});
</script>
</body>
</html>
