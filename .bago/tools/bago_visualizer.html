<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAGO Timeline · Métricas y Sesiones</title>
<style>
:root {
  --bg: #0c0e1a;
  --bg1: #121422;
  --bg2: #1a1d30;
  --bg3: #22253e;
  --border: rgba(255,255,255,0.06);
  --borderHover: rgba(255,255,255,0.15);
  --text: #d4d6e0;
  --textMuted: #7a7f96;
  --textDim: #505570;
  --accent: #8abeb7;
  --accent2: #5f87ff;
  --cyan: #00d7ff;
  --green: #7ee787;
  --red: #ff7b72;
  --yellow: #ffa657;
  --magenta: #d183e8;
  --line: 18px;
  --sidebarW: 380px;
  --font: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  font-size: 12px;
  line-height: var(--line);
  color: var(--text);
  background: var(--bg);
}

#app { display: flex; min-height: 100vh; }

/* ══ SIDEBAR ══ */
#sidebar {
  width: var(--sidebarW);
  background: var(--bg1);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 14px;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 4px;
}

.sidebar-header .meta {
  font-size: 10px;
  color: var(--textMuted);
  margin-bottom: 8px;
}

.sidebar-search {
  width: 100%;
  padding: 5px 8px;
  font-size: 11px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 8px;
}
.sidebar-search:focus { outline: none; border-color: var(--accent2); }
.sidebar-search::placeholder { color: var(--textMuted); }

.sidebar-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 4px; margin-bottom: 6px; }

.filter-btn {
  padding: 3px 8px;
  font-size: 10px;
  font-family: inherit;
  background: transparent;
  color: var(--textMuted);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.12s;
}
.filter-btn:hover { color: var(--text); border-color: var(--textMuted); }
.filter-btn.active { background: var(--accent2); color: var(--bg); border-color: var(--accent2); }

.tree-container { flex: 1; overflow-y: auto; padding: 4px 0; }

/* Timeline row */
.tl-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 11px;
  line-height: 14px;
  border-left: 2px solid transparent;
}
.tl-row:hover { background: var(--bg2); }
.tl-row.active { background: var(--bg3); border-left-color: var(--accent2); }

.tl-prefix {
  color: var(--textMuted);
  flex-shrink: 0;
  white-space: pre;
  font-variant-numeric: tabular-nums;
}

.tl-icon { width: 16px; text-align: center; flex-shrink: 0; }
.tl-badge-session { color: var(--accent); }
.tl-badge-change { color: var(--yellow); }
.tl-badge-evidence { color: var(--green); }
.tl-badge-shell_ok { color: var(--accent); }
.tl-badge-shell_error { color: var(--red); }
.tl-badge-shell_blocked { color: var(--red); }
.tl-badge-shell_dry { color: var(--magenta); }

.tl-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tl-status {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  text-transform: uppercase;
}
.tl-status.ok { background: rgba(126,231,135,0.12); color: var(--green); }
.tl-status.closed { background: rgba(95,135,255,0.12); color: var(--accent2); }
.tl-status.blocked { background: rgba(255,123,114,0.12); color: var(--red); }
.tl-status.dry { background: rgba(209,131,232,0.12); color: var(--magenta); }
.tl-status.error { background: rgba(255,123,114,0.12); color: var(--red); }
.tl-status.pending { background: rgba(255,166,87,0.12); color: var(--yellow); }

.tl-group-header {
  padding: 6px 12px;
  font-size: 10px;
  color: var(--textMuted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  background: var(--bg1);
  border-top: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
}

/* ══ MAIN ══ */
#main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 24px 32px;
}

/* Dashboard */
.dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }

.metric-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.metric-card:hover { border-color: var(--borderHover); }

.metric-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--cyan);
  line-height: 1;
  margin-bottom: 4px;
}
.metric-label {
  font-size: 10px;
  color: var(--textMuted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.metric-card.green .metric-value { color: var(--green); }
.metric-card.red .metric-value { color: var(--red); }
.metric-card.yellow .metric-value { color: var(--yellow); }
.metric-card.magenta .metric-value { color: var(--magenta); }

/* Activity bars */
.activity-section { margin-bottom: 24px; }
.activity-section h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
}

.act-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.act-label {
  width: 70px;
  font-size: 10px;
  color: var(--textMuted);
  text-align: right;
  white-space: nowrap;
}
.act-bar-wrap {
  flex: 1;
  background: var(--bg2);
  border-radius: 3px;
  height: 14px;
  overflow: hidden;
}
.act-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
  min-width: 2px;
}
.act-bar.green { background: linear-gradient(90deg, var(--green), #5cb85c); }
.act-bar.cyan { background: linear-gradient(90deg, var(--cyan), var(--accent2)); }
.act-bar.yellow { background: linear-gradient(90deg, var(--yellow), #ff9248); }
.act-count {
  font-size: 10px;
  color: var(--textMuted);
  width: 24px;
  text-align: left;
}

/* Detail view */
.detail-view {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 24px;
}
.detail-view h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-section {
  margin-bottom: 16px;
}
.detail-section h4 {
  font-size: 11px;
  color: var(--textMuted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.detail-text {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-wrap;
}

.detail-meta {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}
.meta-item {
  font-size: 11px;
  color: var(--textMuted);
}
.meta-item strong {
  color: var(--text);
  display: inline-block;
  margin-right: 6px;
  min-width: 60px;
}

/* Code / log blocks */
.code-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 11px;
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}

/* Shell log table */
.log-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin-top: 8px;
}
.log-table th {
  text-align: left;
  padding: 6px 10px;
  color: var(--textMuted);
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.log-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.log-table tr:hover td { background: var(--bg2); }
.log-table .cat-safe { color: var(--accent); }
.log-table .cat-dangerous { color: var(--red); }
.log-table .cat-caution { color: var(--yellow); }
.log-table .status-blocked { color: var(--red); font-weight: 600; }
.log-table .status-ok { color: var(--green); }

/* Health trend */
.health-trend {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 80px;
  padding: 10px 0;
}
.health-bar {
  flex: 1;
  min-width: 8px;
  border-radius: 2px;
  position: relative;
}
.health-bar:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  padding: 3px 6px;
  background: var(--bg3);
  color: var(--text);
  font-size: 10px;
  border-radius: 3px;
  white-space: nowrap;
  z-index: 10;
  border: 1px solid var(--border);
}
.health-bar.green { background: var(--green); }
.health-bar.yellow { background: var(--yellow); }
.health-bar.red { background: var(--red); }

/* Footer */
.footer {
  margin-top: 48px;
  padding: 16px;
  text-align: center;
  color: var(--textDim);
  font-size: 10px;
  border-top: 1px solid var(--border);
}

.no-data { color: var(--textMuted); text-align: center; padding: 40px; font-style: italic; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--textDim); }

/* Mobile */
#hamburger { display: none; position: fixed; top: 8px; left: 8px; z-index: 100;
  padding: 4px 8px; font-size: 14px; font-family: inherit; background: var(--bg1);
  color: var(--textMuted); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
@media (max-width: 900px) {
  #sidebar { position: fixed; left: 0; width: min(var(--sidebarW), 100vw); top: 0; bottom: 0; z-index: 99;
    transform: translateX(-100%); transition: transform 0.3s; }
  #sidebar.open { transform: translateX(0); }
  #hamburger { display: block; }
  #main { padding: 40px 16px 16px; }
  .dashboard { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>
<body>
<button id="hamburger" onclick="toggleSidebar()">☰</button>
<div id="app">
<aside id="sidebar">
  <div class="sidebar-header">
    <h1>🅱 BAGO Timeline</h1>
    <div class="meta" id="header-meta">Cargando...</div>
    <input type="text" class="sidebar-search" id="tree-search" placeholder="Buscar sesión, change, evidencia..." oninput="filterTree()">
    <div class="sidebar-filters" id="sidebar-filters"></div>
  </div>
  <div class="tree-container" id="tree-container"></div>
</aside>
<main id="main">
  <div id="dashboard-content"></div>
  <div id="detail-content"></div>
  <div id="footer-content"></div>
</main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// DATA LOAD
// ═══════════════════════════════════════════════════════════════════════════════
let DATA = null;
let ACTIVE_FILTER = 'all';
let SELECTED_ID = null;

async function loadData() {
  try {
    const r = await fetch('timeline_data.json');
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    renderFilters();
    renderTree();
    renderDashboard();
    renderDetail(null);
    renderFooter();
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="no-data">
        <div style="font-size:18px; margin-bottom:8px;">⚠️ Sin datos</div>
        <p>No se pudo cargar timeline_data.json</p>
        <p style="font-size:11px; color:var(--textDim);">Ejecuta: python3 .bago/tools/bago_visualizer.py --refresh</p>
        <p style="font-size:11px; color:var(--textDim);">Error: ${e.message}</p>
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════════════════════════════════════
const FILTER_MAP = [
  { key: 'all', label: 'Todos' },
  { key: 'session', label: 'Sesiones' },
  { key: 'change', label: 'Changes' },
  { key: 'evidence', label: 'Evidencias' },
  { key: 'shell_command', label: 'Shell' },
];

function renderFilters() {
  const el = document.getElementById('sidebar-filters');
  el.innerHTML = FILTER_MAP.map(f => `
    <button class="filter-btn${f.key === ACTIVE_FILTER ? ' active' : ''}" data-filter="${f.key}"
      onclick="setFilter('${f.key}')">${f.label}</button>
  `).join('');
}

function setFilter(key) {
  ACTIVE_FILTER = key;
  renderFilters();
  renderTree();
}

// ═══════════════════════════════════════════════════════════════════════════════
// TIMELINE TREE
// ═══════════════════════════════════════════════════════════════════════════════
function renderTree() {
  if (!DATA) return;
  const container = document.getElementById('tree-container');
  const search = document.getElementById('tree-search').value.toLowerCase();
  const items = DATA.timeline || [];

  // Group by date
  const groups = {};
  items.forEach(item => {
    if (ACTIVE_FILTER !== 'all' && item.type !== ACTIVE_FILTER) return;
    if (search) {
      const hay = (item.title + ' ' + item.id + ' ' + (item.status || '')).toLowerCase();
      if (!hay.includes(search)) return;
    }
    const dt = item.time ? item.time.slice(0,10) : 'unknown';
    if (!groups[dt]) groups[dt] = [];
    groups[dt].push(item);
  });

  let html = '';
  const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));
  for (const date of sortedDates) {
    html += `<div class="tl-group-header">${formatDate(date)}</div>`;
    for (const item of groups[date]) {
      html += renderTimelineRow(item);
    }
  }

  container.innerHTML = html || '<div class="no-data" style="padding:20px;">Sin resultados</div>';
}

function renderTimelineRow(item) {
  const isSel = item.id === SELECTED_ID;
  const icon = getTypeIcon(item.type, item.status, item.subtype);
  const statusClass = getStatusClass(item.status);
  const statusLabel = item.status ? item.status.toUpperCase().slice(0,6) : '';
  const time = item.time ? item.time.slice(11,16) : '?';
  const dur = item.duration_ms ? ` (${formatDuration(item.duration_ms)})` : '';
  return `
    <div class="tl-row${isSel ? ' active' : ''}" onclick="selectItem('${esc(item.id)}', '${esc(item.type)}')">
      <span class="tl-prefix">${time}</span>
      <span class="tl-icon">${icon}</span>
      <span class="tl-title">${esc(item.title || item.id)}${dur}</span>
      ${statusLabel ? `<span class="tl-status ${statusClass}">${statusLabel}</span>` : ''}
    </div>`;
}

function getTypeIcon(type, status, subtype) {
  if (type === 'session') return '🟢';
  if (type === 'change') return '🟡';
  if (type === 'evidence') return '🟣';
  if (type === 'shell_command') {
    if (status === 'blocked') return '🔴';
    if (status === 'dry') return '🟣';
    if (status === 'error') return '🔴';
    return '🟢';
  }
  return '⚪';
}

function getStatusClass(status) {
  const map = { ok: 'ok', closed: 'closed', blocked: 'blocked', dry: 'dry', error: 'error', pending: 'pending' };
  return map[status] || '';
}

function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatDate(d) {
  try {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
  } catch { return d; }
}

function formatDuration(ms) {
  if (ms >= 1000) return Math.round(ms/1000) + 's';
  return Math.round(ms) + 'ms';
}

function filterTree() { renderTree(); }

// ═══════════════════════════════════════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════════════════════════════════════
function selectItem(id, type) {
  SELECTED_ID = id;
  renderTree();
  renderDetail(id, type);
}

// ═══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════════
function renderDashboard() {
  if (!DATA) return;
  const m = DATA.metrics?.summary || {};
  const version = DATA.global?.version || DATA.meta?.version || '?';
  const html = `
    <div class="dashboard">
      <div class="metric-card">
        <div class="metric-value">${m.total_sessions || 0}</div>
        <div class="metric-label">Sesiones</div>
      </div>
      <div class="metric-card magenta">
        <div class="metric-value">${m.total_changes || 0}</div>
        <div class="metric-label">Changes</div>
      </div>
      <div class="metric-card green">
        <div class="metric-value">${m.total_evidences || 0}</div>
        <div class="metric-label">Evidencias</div>
      </div>
      <div class="metric-card yellow">
        <div class="metric-value">${(DATA.learnings || []).length}</div>
        <div class="metric-label">Learnings</div>
      </div>
      <div class="metric-card red">
        <div class="metric-value">${m.shell_blocked_commands || 0}</div>
        <div class="metric-label">Bloqueados</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">v${version}</div>
        <div class="metric-label">Versión</div>
      </div>
    </div>
  `;
  document.getElementById('dashboard-content').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════════
// DETAIL VIEW
// ═══════════════════════════════════════════════════════════════════════════════
function renderDetail(id, type) {
  if (!id || !DATA) {
    // Default view: activity + health
    renderActivitySection();
    renderHealthSection();
    renderShellSection();
    return;
  }

  let item = null;
  item = DATA.sessions?.find(s => s.id === id);
  if (!item) item = DATA.changes?.find(c => c.id === id);
  if (!item) item = DATA.evidences?.find(e => e.id === id);
  if (!item) {
    document.getElementById('detail-content').innerHTML = '';
    return;
  }

  const html = `
    <div class="detail-view">
      <h2>${getTypeIcon(type, item.status)} ${esc(item.id)}</h2>
      ${renderDetailContent(item, type)}
    </div>
  `;
  document.getElementById('detail-content').innerHTML = html;
}

function renderDetailContent(item, type) {
  let html = `<div class="detail-meta">`;
  if (item.status) html += `<div class="meta-item"><strong>Estado</strong>${esc(item.status)}</div>`;
  if (item.type) html += `<div class="meta-item"><strong>Tipo</strong>${esc(item.type)}</div>`;
  if (item.workflow) html += `<div class="meta-item"><strong>Workflow</strong>${esc(item.workflow)}</div>`;
  if (item.priority) html += `<div class="meta-item"><strong>Prioridad</strong>${esc(item.priority)}</div>`;
  if (item.created) html += `<div class="meta-item"><strong>Creado</strong>${esc(item.created)}</div>`;
  if (item.artifacts_count) html += `<div class="meta-item"><strong>Artefactos</strong>${item.artifacts_count}</div>`;
  html += `</div>`;

  if (item.goal) html += `
    <div class="detail-section">
      <h4>Objetivo / Decisión</h4>
      <div class="detail-text">${esc(item.goal)}</div>
    </div>`;

  if (item.next_step) html += `
    <div class="detail-section">
      <h4>Próximo paso</h4>
      <div class="detail-text">${esc(item.next_step)}</div>
    </div>`;

  if (item.artifacts?.length) html += `
    <div class="detail-section">
      <h4>Artefactos</h4>
      <div class="detail-text">${item.artifacts.map(a => `• ${esc(a)}`).join('\n')}</div>
    </div>`;

  if (item.decisions?.length) html += `
    <div class="detail-section">
      <h4>Decisiones</h4>
      <div class="detail-text">${item.decisions.map(d => `• ${esc(d)}`).join('\n')}</div>
    </div>`;

  if (item.health) {
    const hs = item.health.score !== undefined ? `${item.health.icon || ''} ${item.health.score}` : '';
    html += `<div class="detail-section"><h4>Health al cosechar</h4><div class="detail-text">${esc(hs)}</div></div>`;
  }

  return html;
}

function renderActivitySection() {
  const act = DATA.metrics?.activity_last_7_days || {};
  const maxVal = Math.max(1, ...Object.values(act));
  const days = Object.keys(act).sort();

  let html = `<div class="activity-section"><h3>📊 Actividad últimos 7 días</h3>`;
  for (const d of days.sort((a,b)=>b.localeCompare(a))) {
    const count = act[d];
    const pct = (count / maxVal) * 100;
    html += `
      <div class="act-row">
        <span class="act-label">${formatDate(d)}</span>
        <div class="act-bar-wrap"><div class="act-bar cyan" style="width:${pct}%"></div></div>
        <span class="act-count">${count}</span>
      </div>`;
  }
  html += `</div>`;
  document.getElementById('detail-content').innerHTML = html;
}

function renderHealthSection() {
  const scores = DATA.metrics?.health_scores || [];
  if (scores.length < 2) return;
  const recent = scores.slice(-30);
  let html = `<div class="activity-section"><h3>💚 Tendencia Health Score</h3><div class="health-trend">`;
  for (const s of recent) {
    const h = s.score || 0;
    const color = h >= 90 ? 'green' : h >= 70 ? 'yellow' : 'red';
    html += `<div class="health-bar ${color}" style="height:${h}%;" data-tooltip="${formatDate(s.date)}: ${h}"></div>`;
  }
  html += `</div></div>`;
  document.getElementById('detail-content').innerHTML += html;
}

function renderShellSection() {
  const logs = (DATA.shell_log || []).slice(-20).reverse();
  if (!logs.length) return;
  let html = `<div class="activity-section"><h3>🐚 Shell Log (últimos 20)</h3>`;
  html += `<table class="log-table"><thead><tr><th>Hora</th><th>Comando</th><th>Categoría</th><th>Exit</th><th>Duración</th></tr></thead><tbody>`;
  for (const e of logs) {
    const catClass = e.category?.includes('dangerous') ? 'cat-dangerous' : (e.category?.includes('caution') ? 'cat-caution' : 'cat-safe');
    const statClass = e.needs_auth && !e.authorized ? 'status-blocked' : (e.exit_code === 0 ? 'status-ok' : '');
    const dur = e.duration_ms ? formatDuration(e.duration_ms) : '';
    html += `<tr><td>${esc(e.timestamp?.slice(11,19)||'')}</td><td>${esc(e.command)}</td><td class="${catClass}">${esc(e.category)}</td><td class="${statClass}">${e.exit_code}</td><td>${dur}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('detail-content').innerHTML += html;
}

function renderFooter() {
  const gen = DATA?.meta?.generated ? new Date(DATA.meta.generated).toLocaleString('es-ES') : '?';
  document.getElementById('footer-content').innerHTML = `
    <div class="footer">
      BAGO Timeline · Generado ${gen} · Datos: ${(DATA?.meta?.data_sources || []).length} fuentes
    </div>`;
}

  document.getElementById('sidebar').classList.toggle('open');
}

loadData();
