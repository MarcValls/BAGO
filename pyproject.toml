[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bago"
version = "3.3.0"
description = "BAGO — Structured AI-assisted development framework"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
keywords = ["bago", "autonomous", "framework", "ai", "productivity"]

[project.scripts]
bago = "bago_core.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["bago_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py39"
