[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bago"
version = "3.5.0"
description = "BAGO CLI runtime with music and image generation projects"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{name = "Marc Valls"}]

[project.urls]
Homepage = "https://github.com/MarcValls/BAGO"
Repository = "https://github.com/MarcValls/BAGO"
Issues = "https://github.com/MarcValls/BAGO/issues"

[project.scripts]
bago = "bago_core.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["bago_core*"]
