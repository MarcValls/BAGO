<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Taberna Galáctica — Partitura</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.4.3/abcjs-audio.css">
<style>
  body {
    background: #0d0d1a;
    color: #e0e0ff;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
    padding: 20px 32px;
    border-bottom: 1px solid #3a3a6a;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { margin: 0; font-size: 1.6rem; color: #a0a0ff; }
  header p  { margin: 4px 0 0; font-size: 0.82rem; color: #6060aa; }
  .badge {
    margin-left: auto;
    background: #2a2a5a;
    border: 1px solid #4a4a8a;
    border-radius: 5px;
    padding: 3px 10px;
    font-size: 0.75rem;
    color: #8080cc;
  }
  #audio-wrap {
    padding: 12px 32px;
    background: #0f0f22;
    border-bottom: 1px solid #2a2a4a;
  }
  #score {
    background: #fff;
    margin: 20px 24px;
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    min-height: 300px;
  }
  .dl {
    display: flex;
    gap: 12px;
    padding: 0 24px 24px;
    flex-wrap: wrap;
  }
  .dl a {
    background: #1a3a1a;
    border: 1px solid #3a8a3a;
    color: #80ff80;
    border-radius: 6px;
    padding: 8px 18px;
    text-decoration: none;
    font-size: 0.85rem;
  }
  .dl a:hover { background: #2a5a2a; }
  .back-link {
    display: inline-block;
    margin: 0 24px;
    padding: 8px 16px;
    color: #6060aa;
    text-decoration: none;
    font-size: 0.85rem;
  }
  /* ABCJS audio player override */
  .abcjs-inline-audio {
    background: #1a1a3a !important;
    border: 1px solid #3a3a6a !important;
    border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🎺 Taberna Galáctica</h1>
    <p>Trío de Tuba/Eufonio · Sol Mayor · Swing 4/4 · 152 BPM · 26 compases · Forma AABA</p>
  </div>
  <span class="badge">Composición Original — BAGO</span>
</header>

<div id="audio-wrap">
  <div id="audio"></div>
</div>

<div id="score"></div>

<div class="dl">
  <a href="taberna_galactica.xml" download>⬇ Descargar MusicXML</a>
  <a href="taberna_galactica.mid" download>⬇ Descargar MIDI</a>
  <a href="/" class="back-link">← Launcher</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.3/dist/abcjs-basic-min.js"></script>
<script>
// ── ABC NOTATION ────────────────────────────────────────────────────────────
// L:1/8 → 2=negra, 4=blanca, 8=redonda, 1=corchea
// K:G  → F es sostenido automáticamente (F# en clave)
const abc = `X:1
T:Taberna Galáctica
C:Composición Original — BAGO 2026
%%subtitle Trío de Tuba/Eufonio — Sol Mayor — Swing
M:4/4
L:1/8
Q:1/4=152
V:1 name="Tuba/Euf. I" clef=treble
V:2 name="Tuba/Euf. II" clef=treble
V:3 name="Tuba III" clef=bass
K:G
[V:1] "^A"d'2g'2b'a'g'2 | e'4d'2c'2 | b2d'2g'2f'2 | g'8 | c'2e'2g'2a'2 | b'4a'2g'2 | f'2a'2d'2c'2 | g'8 | "^B"b'2a'2g'2f'2 | e'4d'4 | c'2e'2g'2a'2 | f'8 | b'2a'2g'2e'2 | d'2f'2a'2b'2 | c''2b'2a'2g'2 | g'8 | "^A'"d'2g'2b'a'g'2 | e'4d'2c'2 | b2d'2g'2f'2 | g'8 | c'2e'2g'2a'2 | b'4a'2g'2 | f'2a'2d'2c'2 | g'4z4 | "^Coda"g'2f'g'f'2g'2 | g'8 |]
[V:2] d'2g'2b'a'g'2 | c'4b2a2 | g2b2d'2c'2 | b8 | a2c'2e'2f'2 | g'4f'2e'2 | d'2f'2a2g2 | b8 | g'2f'2e'2d'2 | c'4b4 | a2c'2e'2f'2 | d'8 | g'2f'2e'2c'2 | b2d'2f'2g'2 | a'2g'2f'2e'2 | e'8 | d'2g'2b'a'g'2 | c'4b2a2 | g2b2d'2c'2 | b8 | a2c'2e'2f'2 | g'4f'2e'2 | d'2f'2a2g2 | b4z4 | e'2de'd2e'2 | b8 |]
[V:3] G,2D2G,4 | C2G,2C4 | G,2D2G,4 | G,4D,4 | F2C2F4 | G,2D2G4 | D2A,2D4 | G,4D,4 | G,2D2G,4 | C2G,2C4 | D2A,2D4 | B,2F,2B,4 | G,2D2G,4 | D2A,2D4 | G,2D2C2B,2 | C4G,4 | G,2D2G,4 | C2G,2C4 | G,2D2G,4 | G,4D,4 | F2C2F4 | G,2D2G4 | D2A,2D4 | G,4z4 | G,2D2G,2D2 | G,8 |]
`;

// ── RENDER ──────────────────────────────────────────────────────────────────
const visualObj = ABCJS.renderAbc('score', abc, {
  responsive: 'resize',
  add_classes: true,
  wrap: {
    minSpacing: 1.6,
    maxSpacing: 2.6,
    preferredMeasuresPerLine: 4
  }
});

// ── AUDIO ───────────────────────────────────────────────────────────────────
if (ABCJS.synth && ABCJS.synth.supportsAudio()) {
  const synthControl = new ABCJS.synth.SynthController();
  synthControl.load('#audio', null, {
    displayLoop: false,
    displayRestart: true,
    displayPlay: true,
    displayProgress: true,
    displayWarp: false
  });
  const midiBuffer = new ABCJS.synth.CreateSynth();
  midiBuffer.init({
    visualObj: visualObj[0],
    options: { program: 58 }
  }).then(() => {
    synthControl.setTune(visualObj[0], false, {});
    document.getElementById('audio-wrap').style.display = 'block';
  }).catch(() => {
    document.getElementById('audio-wrap').innerHTML =
      '<p style="color:#6060aa;font-size:0.85rem;padding:8px 0">▶ Audio no disponible — descarga el MIDI ↓</p>';
  });
} else {
  document.getElementById('audio-wrap').innerHTML =
    '<p style="color:#6060aa;font-size:0.85rem;padding:8px 0">▶ Audio no soportado en este navegador — descarga el MIDI ↓</p>';
}
</script>
</body>
</html>
