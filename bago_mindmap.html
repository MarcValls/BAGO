<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BAGO — Espiral Infinita</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#04060f; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
  canvas { display:block; }
  #tooltip {
    position:fixed; display:none;
    background:rgba(4,6,15,0.95); border:1px solid rgba(255,255,255,0.08);
    padding:10px 16px; border-radius:10px; font-size:12px;
    pointer-events:none; max-width:260px; line-height:1.7;
  }
  #hud {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.15); font-size:11px; letter-spacing:2px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tooltip"></div>
<div id="hud">BAGO · escala cromática · espiral infinita</div>
<script>
// ═══════════════════════════════════════════════════════════
// BAGO — Infinite Chromatic Spiral
//
// Principio: espiral de Arquímedes + bucle de Shepard.
// r(t, θ) = r_min + (r_max - r_min) * frac(θ/2π + t)
//
// Cada vuelta = 1 octava. 12 posiciones = 12 semitonos.
// Los nodos nacen en el centro y mueren en el borde,
// mientras copias idénticas emergen detrás.
// El bucle nunca termina.
// ═══════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const tip    = document.getElementById('tooltip');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
});

// ── Cromática ─────────────────────────────────────────────
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const COLORS = [
  '#ff2255','#ff5533','#ff9900','#ffcc00',
  '#aadd00','#22cc66','#00bbaa','#0099ee',
  '#3355ff','#7722ee','#cc22dd','#ff1177',
];

// ── Nodos BAGO (12 semitonos) ─────────────────────────────
const NODES = [
  { note:0,  label:'KERNEL',   sub:'global_state · sessions · changes · bago.db' },
  { note:1,  label:'CLI',      sub:'113 comandos · 12 core · 7 dangerous · 61 exp' },
  { note:2,  label:'GUARDIAN', sub:'100% required · 14/14 · tier-based health' },
  { note:3,  label:'FLOWS',    sub:'12 protocolos · Balanceado·Adaptativo·Gen·Org' },
  { note:4,  label:'AGENTS',   sub:'Ollama · Codex · Copilot · agent_router' },
  { note:5,  label:'CALIDAD',  sub:'146 tests · sincerity · validate · pre-push' },
  { note:6,  label:'HARDWARE', sub:'30GB pendrive · 2 particiones · BAGO.app' },
  { note:7,  label:'LABS',     sub:'Music · VexFlow · Image Studio · Tablet' },
  { note:8,  label:'STATE',    sub:'global_state.json · bago.db · sessions/' },
  { note:9,  label:'SECURITY', sub:'secret_scan · localhost · no CORS wildcards' },
  { note:10, label:'CI',       sub:'GitHub Actions · 7 gates · consistency check' },
  { note:11, label:'DOCS',     sub:'COMMANDS.md · LAYERS.md · README contract' },
];

// ── Parámetros de la espiral ──────────────────────────────
const TURNS   = 3.5;      // vueltas visibles simultáneamente
const SPEED   = 0.018;    // velocidad de avance (rad/frame · 60fps)
const R_MIN   = 28;       // radio mínimo (centro)
const R_MAX   = () => Math.min(W, H) * 0.46;

let phase = 0;            // fase global acumulada (en vueltas)

// ── Cámara ────────────────────────────────────────────────
let cam = { x:0, y:0, scale:1 };
let drag = false, lastM = null;
canvas.addEventListener('mousedown', e => { drag=true; lastM={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('mouseup',   () => drag=false);
canvas.addEventListener('mouseleave',() => drag=false);
canvas.addEventListener('mousemove', e => {
  if(drag && lastM) {
    cam.x += e.clientX - lastM.x;
    cam.y += e.clientY - lastM.y;
    lastM = {x:e.clientX, y:e.clientY};
  }
  showTooltip(e);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.scale = Math.min(Math.max(cam.scale*(e.deltaY<0?1.1:0.9), 0.3), 3);
},{passive:false});

// ── Tooltip ───────────────────────────────────────────────
function showTooltip(e) {
  const mx = (e.clientX - W/2 - cam.x) / cam.scale;
  const my = (e.clientY - H/2 - cam.y) / cam.scale;
  let found = null;
  getVisibleNodes().forEach(vn => {
    const dx = mx - vn.x, dy = my - vn.y;
    if(Math.hypot(dx,dy) < vn.r + 8) found = vn;
  });
  if(found) {
    tip.style.display='block';
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top =(e.clientY-24)+'px';
    tip.innerHTML=`<span style="color:${found.color};font-weight:700">${found.label}</span>
      &nbsp;<span style="color:#333;font-size:10px">${found.noteLabel}</span><br>
      <span style="color:#556;font-size:11px">${found.sub}</span>`;
  } else { tip.style.display='none'; }
}

// ── Posición en espiral ───────────────────────────────────
// θ en radianes desde 0 hacia arriba; fase en vueltas [0..TURNS]
function spiralXY(theta_rad) {
  // theta_rad = ángulo total recorrido (puede ser > 2π)
  const totalAngle = TURNS * Math.PI * 2;
  const t = (theta_rad % totalAngle) / totalAngle; // 0..1 dentro del rango visible
  const r = R_MIN + (R_MAX() - R_MIN) * Math.pow(t, 0.8);
  // Ángulo en pantalla: empezamos arriba (-π/2) y giramos antihorario
  const screenAngle = theta_rad - Math.PI/2;
  return { x: Math.cos(screenAngle)*r, y: Math.sin(screenAngle)*r, r, t };
}

// ── Nodos visibles en este frame ─────────────────────────
let _visibleCache = [];
function getVisibleNodes() { return _visibleCache; }

function computeVisibleNodes() {
  _visibleCache = [];
  // Para cada nodo (12 semitonos), calculamos cuántas "octavas" son visibles
  // y creamos una instancia por cada una
  NODES.forEach(node => {
    // posición base del nodo en la espiral = nota/12 de vuelta + octavas enteras
    // La fase global desplaza todo
    for(let octave = -1; octave <= TURNS + 1; octave++) {
      const baseAngle = (node.note / 12 + octave - phase) * Math.PI * 2;
      if(baseAngle < -Math.PI*0.5 || baseAngle > TURNS * Math.PI * 2 + Math.PI) continue;
      const pos = spiralXY(baseAngle);
      if(pos.t < 0 || pos.t > 1) continue;
      // Opacidad: fade-in al nacer (centro), fade-out al morir (borde)
      const alpha = pos.t < 0.08
        ? pos.t / 0.08
        : pos.t > 0.88
          ? (1 - pos.t) / 0.12
          : 1.0;
      // Tamaño crece con el radio
      const r = 10 + pos.r * 0.055;
      _visibleCache.push({
        ...node,
        x: pos.x, y: pos.y, r, alpha,
        t: pos.t,
        color: COLORS[node.note],
        noteLabel: NOTES[node.note],
      });
    }
  });
}

// ── Dibujar la espiral de fondo ───────────────────────────
function drawSpiral() {
  const steps = 1200;
  const totalAngle = TURNS * Math.PI * 2;
  ctx.lineWidth = 1;
  for(let i=1; i<=steps; i++) {
    const t0 = (i-1)/steps, t1 = i/steps;
    const a0 = t0 * totalAngle, a1 = t1 * totalAngle;
    const p0 = spiralXY(a0), p1 = spiralXY(a1);
    // Color cromático según posición angular
    const noteF = ((a0 / (Math.PI*2)) % 1) * 12;
    const ni = Math.floor(noteF) % 12;
    const nf = noteF - Math.floor(noteF);
    // Interpolar color entre nota actual y siguiente
    const c1 = hexToRgb(COLORS[ni]);
    const c2 = hexToRgb(COLORS[(ni+1)%12]);
    const r = Math.round(c1[0]*(1-nf)+c2[0]*nf);
    const g = Math.round(c1[1]*(1-nf)+c2[1]*nf);
    const b = Math.round(c1[2]*(1-nf)+c2[2]*nf);
    // Opacidad: fade bordes
    const alpha = t0 < 0.05 ? t0/0.05 : t0 > 0.90 ? (1-t0)/0.10 : 1;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.18*alpha})`;
    ctx.stroke();
  }
}

// ── Dibujar nodos ─────────────────────────────────────────
function drawNode(vn) {
  const {x,y,r,alpha,color,label,noteLabel,t} = vn;
  if(alpha <= 0) return;
  const a = alpha;

  // Glow
  const glow = ctx.createRadialGradient(x,y,r*0.2, x,y,r*3);
  glow.addColorStop(0, hexRgba(color, 0.22*a));
  glow.addColorStop(1, 'transparent');
  ctx.beginPath(); ctx.arc(x,y,r*3,0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();

  // Círculo
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  const fill = ctx.createRadialGradient(x,y,0, x,y,r);
  fill.addColorStop(0, hexRgba(color, 0.20*a));
  fill.addColorStop(1, hexRgba(color, 0.05*a));
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle = hexRgba(color, 0.7*a);
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Nota (encima del círculo)
  ctx.fillStyle = hexRgba(color, 0.45*a);
  ctx.font = `${Math.max(7, r*0.55)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(noteLabel, x, y - r - 7);

  // Label
  ctx.fillStyle = hexRgba(color, 0.9*a);
  ctx.font = `bold ${Math.max(8, r*0.65)}px 'Segoe UI',sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x, y);
}

// ── Centro tonal ──────────────────────────────────────────
function drawCenter() {
  // Punto de origen de la espiral — todas las notas convergen aquí
  for(let i=0; i<12; i++) {
    const a = (phase*12 + i) / 12 * Math.PI*2;
    const pulse = (Math.sin(Date.now()*0.002 + i*Math.PI*2/12)+1)*0.5;
    ctx.beginPath();
    ctx.arc(0, 0, R_MIN * (0.6 + pulse*0.4), 0, Math.PI*2);
    ctx.strokeStyle = hexRgba(COLORS[i], 0.07 + pulse*0.08);
    ctx.lineWidth=1; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fill();
}

// ── Helpers ───────────────────────────────────────────────
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function hexRgba(hex, a) {
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

// ── Loop ──────────────────────────────────────────────────
function frame() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 + cam.x, H/2 + cam.y);
  ctx.scale(cam.scale, cam.scale);

  phase += SPEED / (Math.PI*2);  // avanza fracción de vuelta por frame

  computeVisibleNodes();
  drawSpiral();
  drawCenter();
  // Ordenar por tamaño (los pequeños = fondo, los grandes = frente)
  [..._visibleCache].sort((a,b)=>a.r-b.r).forEach(drawNode);

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
